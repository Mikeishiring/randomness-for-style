<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 01 Performance</title>
<style>
  :root{
    --track:#0c1512;        /* midnight racing green */
    --panel:#12211b;
    --panel-edge:#24382f;
    --ivory:#ece5d8;
    --muted:#93a097;
    --gold:#c9a35c;
    --gold-soft:#8c7645;
    --bar:#2e5243;
    --bar-top:#c9a35c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--track);
    color:var(--ivory);
    font-family:"Helvetica Neue",Arial,sans-serif;
    line-height:1.4;
    padding:0 16px 56px;
  }
  .wrap{max-width:960px;margin:0 auto}

  /* checkered band */
  .checker{
    height:10px;
    margin:0 -16px;
    background:
      repeating-conic-gradient(rgba(201,163,92,.28) 0% 25%, transparent 0% 50%)
      0 0 / 20px 20px;
    border-bottom:1px solid var(--panel-edge);
  }

  header{
    display:flex;align-items:baseline;justify-content:space-between;
    flex-wrap:wrap;gap:8px 24px;
    padding:36px 0 20px;
    border-bottom:1px solid var(--gold-soft);
  }
  .nameplate{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  h1{
    font-family:Didot,"Bodoni MT","Times New Roman",Georgia,serif;
    font-weight:400;font-size:2.4rem;letter-spacing:.06em;
  }
  .fn{
    font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;
    color:var(--gold);
  }
  .badge{
    font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;
    color:var(--muted);border:1px solid var(--panel-edge);
    border-radius:2px;padding:3px 8px;
  }

  /* KPI row */
  .kpis{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:1px;background:var(--panel-edge);
    border:1px solid var(--panel-edge);margin:28px 0;
  }
  .kpi{background:var(--panel);padding:18px 20px 16px;position:relative}
  .kpi::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(var(--gold),var(--gold-soft));
  }
  .kpi .label{
    font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px;
  }
  .kpi .value{
    font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;
    font-style:italic;font-weight:700;font-size:2rem;
    color:var(--gold);letter-spacing:.02em;
  }
  .kpi .value small{font-size:1.1rem;color:var(--ivory);font-style:italic}

  section{
    background:var(--panel);border:1px solid var(--panel-edge);
    padding:22px 24px 24px;margin-bottom:24px;
  }
  h2{
    font-family:Didot,"Bodoni MT","Times New Roman",Georgia,serif;
    font-weight:400;font-size:1.15rem;letter-spacing:.14em;
    text-transform:uppercase;margin-bottom:16px;
    display:flex;align-items:baseline;gap:12px;
  }
  h2 .rule{flex:1;height:1px;background:var(--panel-edge)}
  svg{width:100%;height:auto;display:block}
  .axis{fill:var(--muted);font-size:11px;font-family:"Helvetica Neue",Arial,sans-serif}
  .vlab{fill:var(--ivory);font-size:12px;font-weight:600;font-style:italic;
        font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif}
  .slab{fill:var(--gold);font-size:12px;font-weight:600;font-style:italic;
        font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif}
  .day{fill:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .legend{fill:var(--muted);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}

  /* sources table */
  table{width:100%;border-collapse:collapse}
  th{
    font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);font-weight:400;text-align:right;
    padding:0 0 10px;border-bottom:1px solid var(--panel-edge);
  }
  th:first-child{text-align:left}
  td{padding:12px 0 4px;text-align:right;vertical-align:middle;
     font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;
     font-style:italic;font-weight:600;font-size:1.05rem}
  td:first-child{
    text-align:left;font-family:Didot,"Bodoni MT","Times New Roman",Georgia,serif;
    font-style:normal;font-weight:400;letter-spacing:.08em;font-size:1rem;width:28%;
  }
  td.conv{color:var(--gold)}
  tr.bar-row td{padding:4px 0 10px;border-bottom:1px solid var(--panel-edge)}
  tr.bar-row:last-child td{border-bottom:none}
  .hbar{height:8px;background:var(--bar);position:relative}
  .hbar i{position:absolute;inset:0 auto 0 0;background:var(--gold);width:var(--w)}
  .hbar{background:#1b2d25}

  footer{
    margin-top:8px;display:flex;justify-content:space-between;
    font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  }
</style>
</head>
<body>
<div class="checker"></div>
<div class="wrap">

  <header>
    <div class="nameplate">
      <span class="fn">Website Performance</span>
      <h1>Week 01</h1>
    </div>
    <span class="badge">Synthetic data</span>
  </header>

  <div class="kpis">
    <div class="kpi"><div class="label">Visits</div><div class="value">12,480</div></div>
    <div class="kpi"><div class="label">Signups</div><div class="value">624</div></div>
    <div class="kpi"><div class="label">Conversion</div><div class="value">5.0<small>%</small></div></div>
    <div class="kpi"><div class="label">Peak day</div><div class="value">Sun <small>2,100</small></div></div>
  </div>

  <section>
    <h2>Daily <span class="rule"></span></h2>
    <svg viewBox="0 0 660 268" role="img" aria-label="Daily visits as bars, Monday 1420 rising to Sunday 2100 with a dip Thursday; signups per day shown in gold below, 57 rising to 127.">
      <text x="35" y="12" class="legend">Visits</text>
      <text x="90" y="12" class="legend" fill="#c9a35c">Signups</text>
      <!-- gridlines -->
      <line x1="30" y1="210" x2="630" y2="210" stroke="#3a4f44" stroke-width="1"/>
      <line x1="30" y1="128.2" x2="630" y2="128.2" stroke="#24382f" stroke-width="1"/>
      <line x1="30" y1="46.4"  x2="630" y2="46.4"  stroke="#24382f" stroke-width="1"/>
      <text x="26" y="131" class="axis" text-anchor="end">1k</text>
      <text x="26" y="49"  class="axis" text-anchor="end">2k</text>

      <!-- bars: Mon..Sun -->
      <g>
        <rect x="35"  y="93.8" width="54" height="116.2" fill="#2e5243"/><rect x="35"  y="93.8" width="54" height="2.5" fill="#c9a35c"/>
        <rect x="125" y="79.1" width="54" height="130.9" fill="#2e5243"/><rect x="125" y="79.1" width="54" height="2.5" fill="#c9a35c"/>
        <rect x="215" y="64.4" width="54" height="145.6" fill="#2e5243"/><rect x="215" y="64.4" width="54" height="2.5" fill="#c9a35c"/>
        <rect x="305" y="75.8" width="54" height="134.2" fill="#2e5243"/><rect x="305" y="75.8" width="54" height="2.5" fill="#c9a35c"/>
        <rect x="395" y="52.9" width="54" height="157.1" fill="#2e5243"/><rect x="395" y="52.9" width="54" height="2.5" fill="#c9a35c"/>
        <rect x="485" y="44.7" width="54" height="165.3" fill="#2e5243"/><rect x="485" y="44.7" width="54" height="2.5" fill="#c9a35c"/>
        <rect x="575" y="38.2" width="54" height="171.8" fill="#3a6854"/><rect x="575" y="38.2" width="54" height="2.5" fill="#c9a35c"/>
      </g>

      <!-- visit values -->
      <text x="62"  y="88"   class="vlab" text-anchor="middle">1,420</text>
      <text x="152" y="73.3" class="vlab" text-anchor="middle">1,600</text>
      <text x="242" y="58.6" class="vlab" text-anchor="middle">1,780</text>
      <text x="332" y="70"   class="vlab" text-anchor="middle">1,640</text>
      <text x="422" y="47.1" class="vlab" text-anchor="middle">1,920</text>
      <text x="512" y="38.9" class="vlab" text-anchor="middle">2,020</text>
      <text x="602" y="32.4" class="vlab" text-anchor="middle">2,100</text>

      <!-- day labels -->
      <text x="62"  y="230" class="day" text-anchor="middle">Mon</text>
      <text x="152" y="230" class="day" text-anchor="middle">Tue</text>
      <text x="242" y="230" class="day" text-anchor="middle">Wed</text>
      <text x="332" y="230" class="day" text-anchor="middle">Thu</text>
      <text x="422" y="230" class="day" text-anchor="middle">Fri</text>
      <text x="512" y="230" class="day" text-anchor="middle">Sat</text>
      <text x="602" y="230" class="day" text-anchor="middle">Sun</text>

      <!-- signups row -->
      <text x="62"  y="252" class="slab" text-anchor="middle">57</text>
      <text x="152" y="252" class="slab" text-anchor="middle">72</text>
      <text x="242" y="252" class="slab" text-anchor="middle">89</text>
      <text x="332" y="252" class="slab" text-anchor="middle">74</text>
      <text x="422" y="252" class="slab" text-anchor="middle">96</text>
      <text x="512" y="252" class="slab" text-anchor="middle">109</text>
      <text x="602" y="252" class="slab" text-anchor="middle">127</text>
    </svg>
  </section>

  <section>
    <h2>Conversion by day <span class="rule"></span></h2>
    <svg viewBox="0 0 660 118" role="img" aria-label="Conversion rate by day: 4.0 percent Monday rising to 6.0 percent Sunday, flat around 4.5 to 5.0 percent midweek.">
      <line x1="30" y1="95" x2="630" y2="95" stroke="#24382f"/>
      <line x1="30" y1="41.7" x2="630" y2="41.7" stroke="#24382f"/>
      <text x="26" y="98"   class="axis" text-anchor="end">3.5%</text>
      <text x="26" y="44.7" class="axis" text-anchor="end">5.5%</text>
      <polyline points="62,81.4 152,68.3 242,55 332,68.1 422,55 512,44.3 602,27"
                fill="none" stroke="#c9a35c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <g fill="#0c1512" stroke="#c9a35c" stroke-width="2">
        <circle cx="62"  cy="81.4" r="3.5"/><circle cx="152" cy="68.3" r="3.5"/>
        <circle cx="242" cy="55"   r="3.5"/><circle cx="332" cy="68.1" r="3.5"/>
        <circle cx="422" cy="55"   r="3.5"/><circle cx="512" cy="44.3" r="3.5"/>
        <circle cx="602" cy="27"   r="3.5"/>
      </g>
      <text x="62"  y="104" class="slab" text-anchor="middle">4.0%</text>
      <text x="152" y="88"  class="slab" text-anchor="middle">4.5%</text>
      <text x="242" y="75"  class="slab" text-anchor="middle">5.0%</text>
      <text x="332" y="88"  class="slab" text-anchor="middle">4.5%</text>
      <text x="422" y="75"  class="slab" text-anchor="middle">5.0%</text>
      <text x="512" y="64.3" class="slab" text-anchor="middle">5.4%</text>
      <text x="602" y="17"  class="slab" text-anchor="middle">6.0%</text>
    </svg>
  </section>

  <section>
    <h2>Sources <span class="rule"></span></h2>
    <table>
      <thead>
        <tr><th scope="col">Source</th><th scope="col">Visits</th><th scope="col">Signups</th><th scope="col">Conv.</th></tr>
      </thead>
      <tbody>
        <tr><td>Direct</td><td>5,240</td><td>314</td><td class="conv">6.0%</td></tr>
        <tr class="bar-row"><td colspan="4"><div class="hbar"><i style="--w:100%"></i></div></td></tr>
        <tr><td>Search</td><td>4,480</td><td>224</td><td class="conv">5.0%</td></tr>
        <tr class="bar-row"><td colspan="4"><div class="hbar"><i style="--w:85.5%"></i></div></td></tr>
        <tr><td>Social</td><td>2,760</td><td>86</td><td class="conv">3.1%</td></tr>
        <tr class="bar-row"><td colspan="4"><div class="hbar"><i style="--w:52.7%"></i></div></td></tr>
      </tbody>
    </table>
  </section>

  <footer>
    <span>Week 01</span>
    <span>Mon &ndash; Sun</span>
  </footer>

</div>
</body>
</html>
