<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 01 Performance</title>
<style>
  :root {
    --abyss: #04090f;
    --panel-top: rgba(13, 27, 40, 0.85);
    --panel-bottom: rgba(8, 17, 27, 0.92);
    --line: rgba(205, 176, 120, 0.22);
    --line-faint: rgba(205, 176, 120, 0.10);
    --gold: #cdb078;
    --gold-dim: rgba(205, 176, 120, 0.68);
    --cream: #f1e9d8;
    --ink: #c3d2d6;
    --glow: #6ef0dc;
    --glow-soft: rgba(110, 240, 220, 0.35);
    --serif: Georgia, 'Times New Roman', serif;
    --sans: 'Avenir Next', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--abyss);
    background-image:
      radial-gradient(1.5px 1.5px at 12% 22%, rgba(140, 255, 230, 0.55), transparent 100%),
      radial-gradient(1px 1px at 78% 14%, rgba(140, 255, 230, 0.4), transparent 100%),
      radial-gradient(1.5px 1.5px at 62% 64%, rgba(140, 255, 230, 0.3), transparent 100%),
      radial-gradient(1px 1px at 30% 82%, rgba(140, 255, 230, 0.35), transparent 100%),
      radial-gradient(2px 2px at 88% 48%, rgba(140, 255, 230, 0.25), transparent 100%),
      radial-gradient(1100px 520px at 82% -8%, rgba(30, 88, 102, 0.28), transparent 65%),
      radial-gradient(900px 640px at 12% 112%, rgba(16, 104, 92, 0.20), transparent 65%);
    color: var(--ink);
    font-family: var(--sans);
    font-variant-numeric: tabular-nums;
    min-height: 100vh;
  }

  .page {
    max-width: 860px;
    margin: 0 auto;
    padding: 56px 20px 72px;
  }

  /* Header */
  header { text-align: center; margin-bottom: 44px; }

  .ornament {
    display: flex; align-items: center; gap: 14px;
    max-width: 320px; margin: 0 auto 22px;
    color: var(--gold);
    font-size: 10px;
  }
  .ornament::before, .ornament::after {
    content: ""; flex: 1; border-top: 1px solid var(--line);
  }

  .scope {
    font-size: 12px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 14px;
  }
  .scope .caveat {
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 3px 8px 2px 10px;
    margin-left: 10px;
  }

  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(30px, 6vw, 44px);
    letter-spacing: 0.04em;
    color: var(--cream);
  }

  /* Panels */
  .panel {
    border: 1px solid var(--line);
    outline: 1px solid var(--line-faint);
    outline-offset: -6px;
    border-radius: 3px;
    background: linear-gradient(180deg, var(--panel-top), var(--panel-bottom));
    padding: 28px;
    margin-bottom: 28px;
  }

  /* KPIs */
  .kpis {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    text-align: center;
  }
  .kpi + .kpi { border-left: 1px solid var(--line-faint); }
  .kpi .label {
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 12px;
  }
  .kpi .value {
    font-family: var(--serif);
    font-size: clamp(26px, 5vw, 38px);
    color: var(--cream);
  }
  .kpi .value.lum {
    color: var(--glow);
    text-shadow: 0 0 18px var(--glow-soft);
  }

  /* Section headings */
  .section-head {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 22px;
  }
  .section-head h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 15px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    white-space: nowrap;
  }
  .section-head::after { content: ""; flex: 1; border-top: 1px solid var(--line); }

  .legend {
    display: flex; gap: 18px;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink);
    white-space: nowrap;
  }
  .legend .sw {
    display: inline-block; width: 9px; height: 9px;
    margin-right: 7px; vertical-align: 0;
    border-radius: 1px;
  }
  .sw.visits { background: var(--glow); box-shadow: 0 0 8px var(--glow-soft); }
  .sw.signups { background: var(--gold); }

  svg.chart { display: block; width: 100%; height: auto; }
  svg.chart text { font-family: var(--sans); }
  .v-val { fill: #bfe9e0; font-size: 13px; }
  .s-val { fill: #e6cf9a; font-size: 12px; }
  .day   { fill: var(--gold-dim); font-size: 11px; letter-spacing: 2px; }

  /* Sources */
  .srow, .shead {
    display: grid;
    grid-template-columns: 88px 1fr 84px 80px 60px;
    grid-template-areas: "name bar visits signups rate";
    gap: 14px;
    align-items: center;
    padding: 13px 0;
  }
  .srow { border-top: 1px solid var(--line-faint); }
  .shead {
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--gold-dim);
    padding-bottom: 10px;
  }
  .c-name { grid-area: name; font-family: var(--serif); font-size: 17px; color: var(--cream); }
  .shead .c-name { font-family: var(--sans); font-size: 11px; color: var(--gold-dim); }
  .c-bar  { grid-area: bar; }
  .c-visits  { grid-area: visits;  text-align: right; color: #d7eee8; }
  .c-signups { grid-area: signups; text-align: right; color: #e6cf9a; }
  .c-rate    { grid-area: rate;    text-align: right; color: var(--cream); }

  .bar {
    height: 10px;
    border-radius: 1px;
    background: linear-gradient(90deg, rgba(31, 127, 120, 0.35), var(--glow));
    box-shadow: 0 0 14px var(--glow-soft);
  }

  @media (max-width: 560px) {
    .panel { padding: 22px 18px; }
    .srow, .shead {
      grid-template-columns: 1fr 76px 72px 52px;
      grid-template-areas:
        "name visits signups rate"
        "bar  bar    bar     bar";
      gap: 8px 10px;
    }
    .shead { grid-template-areas: "name visits signups rate"; }
    .c-name { font-size: 15px; }
  }
</style>
</head>
<body>
  <div class="page">

    <header>
      <div class="ornament">&#9670;</div>
      <p class="scope">Week 01<span class="caveat">Synthetic data</span></p>
      <h1>Website Performance</h1>
    </header>

    <section class="panel kpis" aria-label="Week totals">
      <div class="kpi">
        <div class="label">Visits</div>
        <div class="value">12,480</div>
      </div>
      <div class="kpi">
        <div class="label">Signups</div>
        <div class="value">624</div>
      </div>
      <div class="kpi">
        <div class="label">Signup rate</div>
        <div class="value lum">5.0%</div>
      </div>
    </section>

    <section class="panel">
      <div class="section-head">
        <h2>Daily</h2>
        <div class="legend">
          <span><span class="sw visits"></span>Visits</span>
          <span><span class="sw signups"></span>Signups</span>
        </div>
      </div>

      <svg class="chart" viewBox="0 0 680 324" role="img"
           aria-label="Daily visits and signups, Monday to Sunday. Visits rise from 1,420 on Monday to 2,100 on Sunday. Signups rise from 57 on Monday to 127 on Sunday.">
        <defs>
          <linearGradient id="v" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6ef0dc" stop-opacity="0.95"/>
            <stop offset="1" stop-color="#1f7f78" stop-opacity="0.12"/>
          </linearGradient>
          <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ecd29b" stop-opacity="0.95"/>
            <stop offset="1" stop-color="#8a7446" stop-opacity="0.18"/>
          </linearGradient>
          <filter id="glow" x="-60%" y="-120%" width="220%" height="340%">
            <feGaussianBlur stdDeviation="3.5" result="b"/>
            <feMerge>
              <feMergeNode in="b"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <!-- Visits band -->
        <rect x="38"  y="109" width="52" height="101" fill="url(#v)"/>
        <rect x="130" y="96"  width="52" height="114" fill="url(#v)"/>
        <rect x="222" y="83"  width="52" height="127" fill="url(#v)"/>
        <rect x="314" y="93"  width="52" height="117" fill="url(#v)"/>
        <rect x="406" y="73"  width="52" height="137" fill="url(#v)"/>
        <rect x="498" y="66"  width="52" height="144" fill="url(#v)"/>
        <rect x="590" y="60"  width="52" height="150" fill="url(#v)"/>

        <rect x="38"  y="109" width="52" height="2.5" fill="#a9f5e8" filter="url(#glow)"/>
        <rect x="130" y="96"  width="52" height="2.5" fill="#a9f5e8" filter="url(#glow)"/>
        <rect x="222" y="83"  width="52" height="2.5" fill="#a9f5e8" filter="url(#glow)"/>
        <rect x="314" y="93"  width="52" height="2.5" fill="#a9f5e8" filter="url(#glow)"/>
        <rect x="406" y="73"  width="52" height="2.5" fill="#a9f5e8" filter="url(#glow)"/>
        <rect x="498" y="66"  width="52" height="2.5" fill="#a9f5e8" filter="url(#glow)"/>
        <rect x="590" y="60"  width="52" height="2.5" fill="#a9f5e8" filter="url(#glow)"/>

        <text class="v-val" x="64"  y="100" text-anchor="middle">1,420</text>
        <text class="v-val" x="156" y="87"  text-anchor="middle">1,600</text>
        <text class="v-val" x="248" y="74"  text-anchor="middle">1,780</text>
        <text class="v-val" x="340" y="84"  text-anchor="middle">1,640</text>
        <text class="v-val" x="432" y="64"  text-anchor="middle">1,920</text>
        <text class="v-val" x="524" y="57"  text-anchor="middle">2,020</text>
        <text class="v-val" x="616" y="51"  text-anchor="middle">2,100</text>

        <line x1="24" y1="210.5" x2="656" y2="210.5" stroke="rgba(205,176,120,0.3)" stroke-width="1"/>

        <!-- Day axis -->
        <text class="day" x="64"  y="234" text-anchor="middle">MON</text>
        <text class="day" x="156" y="234" text-anchor="middle">TUE</text>
        <text class="day" x="248" y="234" text-anchor="middle">WED</text>
        <text class="day" x="340" y="234" text-anchor="middle">THU</text>
        <text class="day" x="432" y="234" text-anchor="middle">FRI</text>
        <text class="day" x="524" y="234" text-anchor="middle">SAT</text>
        <text class="day" x="616" y="234" text-anchor="middle">SUN</text>

        <!-- Signups band -->
        <rect x="51"  y="294" width="26" height="18" fill="url(#s)"/>
        <rect x="143" y="289" width="26" height="23" fill="url(#s)"/>
        <rect x="235" y="284" width="26" height="28" fill="url(#s)"/>
        <rect x="327" y="289" width="26" height="23" fill="url(#s)"/>
        <rect x="419" y="282" width="26" height="30" fill="url(#s)"/>
        <rect x="511" y="278" width="26" height="34" fill="url(#s)"/>
        <rect x="603" y="272" width="26" height="40" fill="url(#s)"/>

        <text class="s-val" x="64"  y="287" text-anchor="middle">57</text>
        <text class="s-val" x="156" y="282" text-anchor="middle">72</text>
        <text class="s-val" x="248" y="277" text-anchor="middle">89</text>
        <text class="s-val" x="340" y="282" text-anchor="middle">74</text>
        <text class="s-val" x="432" y="275" text-anchor="middle">96</text>
        <text class="s-val" x="524" y="271" text-anchor="middle">109</text>
        <text class="s-val" x="616" y="265" text-anchor="middle">127</text>

        <line x1="24" y1="312.5" x2="656" y2="312.5" stroke="rgba(205,176,120,0.3)" stroke-width="1"/>
      </svg>
    </section>

    <section class="panel">
      <div class="section-head">
        <h2>Sources</h2>
      </div>

      <div class="shead" aria-hidden="true">
        <span class="c-name">Source</span>
        <span class="c-bar"></span>
        <span class="c-visits">Visits</span>
        <span class="c-signups">Signups</span>
        <span class="c-rate">Rate</span>
      </div>

      <div class="srow">
        <span class="c-name">Direct</span>
        <span class="c-bar"><span class="bar" style="width:100%; display:block;"></span></span>
        <span class="c-visits">5,240</span>
        <span class="c-signups">314</span>
        <span class="c-rate">6.0%</span>
      </div>

      <div class="srow">
        <span class="c-name">Search</span>
        <span class="c-bar"><span class="bar" style="width:85.5%; display:block;"></span></span>
        <span class="c-visits">4,480</span>
        <span class="c-signups">224</span>
        <span class="c-rate">5.0%</span>
      </div>

      <div class="srow">
        <span class="c-name">Social</span>
        <span class="c-bar"><span class="bar" style="width:52.7%; display:block;"></span></span>
        <span class="c-visits">2,760</span>
        <span class="c-signups">86</span>
        <span class="c-rate">3.1%</span>
      </div>
    </section>

  </div>
</body>
</html>
