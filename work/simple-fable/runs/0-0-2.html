<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Performance — Week 01</title>
<style>
  :root {
    color-scheme: dark;
    --abyss: #050d12;
    --panel: #0a1a21;
    --panel-edge: #12333c;
    --ink: #c9e8e0;
    --dim: #67938d;
    --glow: #3ef0c0;
    --glow-soft: #8ff5dd;
    --violet: #9a7bff;
    --violet-ink: #c3b2f9;
    --serif: "Palatino Linotype", Palatino, Georgia, serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background:
      radial-gradient(1100px 500px at 50% -180px, rgba(62,240,192,.10), transparent 70%),
      radial-gradient(900px 700px at 85% 110%, rgba(110,85,196,.08), transparent 65%),
      var(--abyss);
    color: var(--ink);
    font-family: var(--serif);
    min-height: 100vh;
  }
  .deep {
    position: fixed; bottom: -30px; width: 340px; max-width: 46vw;
    pointer-events: none; z-index: 0;
  }
  .deep.l { left: -40px; }
  .deep.r { right: -40px; transform: scaleX(-1); }
  main {
    position: relative; z-index: 1;
    max-width: 880px; margin: 0 auto; padding: 36px 16px 56px;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding-bottom: 20px; margin-bottom: 24px;
    border-bottom: 1px solid var(--panel-edge);
  }
  h1 {
    font-size: 20px; font-weight: 600; letter-spacing: .22em;
    text-transform: uppercase; color: var(--glow-soft);
    text-shadow: 0 0 18px rgba(62,240,192,.35);
  }
  .spacer { flex: 1; }
  .period { font-family: var(--mono); font-size: 14px; color: var(--ink); }
  .chip {
    font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
    color: var(--dim); border: 1px solid var(--panel-edge);
    border-radius: 999px; padding: 3px 10px;
  }
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px; margin-bottom: 24px;
  }
  .stat {
    background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: 10px; padding: 14px 16px;
    box-shadow: inset 0 0 30px rgba(62,240,192,.03);
  }
  .stat dt {
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--dim); margin-bottom: 6px;
  }
  .stat dd {
    font-family: var(--mono); font-size: 26px; color: var(--glow);
    text-shadow: 0 0 14px rgba(62,240,192,.3);
  }
  .stat.alt dd { color: var(--violet); text-shadow: 0 0 14px rgba(154,123,255,.3); }
  .stat dd small { font-size: 14px; color: var(--dim); margin-left: 4px; }
  section {
    background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: 10px; padding: 18px 18px 14px; margin-bottom: 24px;
    box-shadow: inset 0 0 40px rgba(62,240,192,.03);
  }
  h2 {
    font-size: 12px; font-weight: 600; letter-spacing: .22em;
    text-transform: uppercase; color: var(--dim); margin-bottom: 12px;
  }
  svg.chart { width: 100%; height: auto; display: block; }
  .srcgrid {
    display: grid;
    grid-template-columns: 58px 1fr 56px 44px 44px;
    gap: 10px; align-items: center;
    font-family: var(--mono); font-size: 13px;
  }
  .srcgrid .h {
    font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--dim);
  }
  .srcgrid .num { text-align: right; }
  .srcgrid .v { color: var(--glow); }
  .srcgrid .s { color: var(--violet-ink); }
  .srcgrid .c { color: var(--ink); }
  .name { font-family: var(--serif); font-size: 14px; letter-spacing: .04em; }
  .bars { display: flex; flex-direction: column; gap: 3px; }
  .track {
    height: 10px; border-radius: 5px; background: rgba(18,51,60,.5);
    overflow: hidden;
  }
  .track.st { height: 6px; border-radius: 3px; }
  .fill {
    display: block; height: 100%; border-radius: 5px;
    background: linear-gradient(90deg, #0f4f4e, var(--glow));
    box-shadow: 0 0 10px rgba(62,240,192,.35);
  }
  .fill.sf {
    border-radius: 3px;
    background: linear-gradient(90deg, #352566, var(--violet));
    box-shadow: 0 0 8px rgba(154,123,255,.35);
  }
</style>
</head>
<body>

<svg class="deep l" viewBox="0 0 340 380" aria-hidden="true">
  <g fill="none" stroke="#3ef0c0" stroke-linecap="round" opacity=".13">
    <path d="M30 400 C 10 300, 120 280, 110 200 C 102 140, 20 130, 55 70" stroke-width="20"/>
    <path d="M120 400 C 150 320, 80 270, 130 210 C 170 165, 230 190, 215 120" stroke-width="14"/>
    <path d="M210 400 C 250 340, 200 300, 250 250 C 290 212, 330 240, 320 180" stroke-width="9"/>
  </g>
  <g fill="#3ef0c0" opacity=".14">
    <circle cx="96" cy="250" r="4"/><circle cx="84" cy="300" r="5"/>
    <circle cx="70" cy="350" r="6"/><circle cx="150" cy="255" r="3.5"/>
    <circle cx="135" cy="320" r="4.5"/><circle cx="250" cy="300" r="3.5"/>
    <circle cx="112" cy="222" r="3"/><circle cx="230" cy="340" r="4.5"/>
  </g>
</svg>
<svg class="deep r" viewBox="0 0 340 380" aria-hidden="true">
  <g fill="none" stroke="#9a7bff" stroke-linecap="round" opacity=".10">
    <path d="M40 400 C 20 310, 130 290, 115 205 C 105 145, 30 135, 60 75" stroke-width="18"/>
    <path d="M140 400 C 170 330, 100 280, 150 220 C 190 175, 250 200, 235 130" stroke-width="12"/>
  </g>
  <g fill="#9a7bff" opacity=".11">
    <circle cx="100" cy="260" r="4"/><circle cx="88" cy="315" r="5"/>
    <circle cx="165" cy="265" r="3.5"/><circle cx="125" cy="360" r="5"/>
  </g>
</svg>

<main>
  <header>
    <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="16" r="10" fill="none" stroke="#3ef0c0" stroke-width="1.6"/>
      <ellipse cx="20" cy="16" rx="2.1" ry="5.6" fill="#3ef0c0"/>
      <g fill="none" stroke="#3ef0c0" stroke-width="1.6" stroke-linecap="round" opacity=".8">
        <path d="M13 25 C 11 30, 6 31, 5 36"/>
        <path d="M20 26.5 C 20 31, 17 33, 18 38"/>
        <path d="M27 25 C 29 30, 34 31, 35 36"/>
      </g>
    </svg>
    <h1>Site Performance</h1>
    <span class="spacer"></span>
    <span class="period">Week 01</span>
    <span class="chip">synthetic</span>
  </header>

  <dl class="stats">
    <div class="stat"><dt>Visits</dt><dd>12,480</dd></div>
    <div class="stat alt"><dt>Signups</dt><dd>624</dd></div>
    <div class="stat"><dt>Conversion</dt><dd>5.0<small>%</small></dd></div>
    <div class="stat"><dt>Peak day</dt><dd>Sun<small>2,100</small></dd></div>
  </dl>

  <section>
    <h2>By day</h2>
    <svg class="chart" viewBox="0 0 740 312" role="img"
         aria-label="Daily chart. Visits rise above the waterline: Mon 1420, Tue 1600, Wed 1780, Thu 1640, Fri 1920, Sat 2020, Sun 2100. Signups hang below it on their own scale: Mon 57, Tue 72, Wed 89, Thu 74, Fri 96, Sat 109, Sun 127. Conversion per day: 4.0, 4.5, 5.0, 4.5, 5.0, 5.4, 6.0 percent. Both series rise through the week and peak Sunday.">
      <defs>
        <linearGradient id="gV" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#0f4f4e"/>
          <stop offset="1" stop-color="#3ef0c0"/>
        </linearGradient>
        <linearGradient id="gS" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#352566"/>
          <stop offset="1" stop-color="#9a7bff"/>
        </linearGradient>
        <filter id="glowV" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#3ef0c0" flood-opacity=".3"/>
        </filter>
        <filter id="glowS" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#9a7bff" flood-opacity=".3"/>
        </filter>
      </defs>

      <g stroke="#123a40" stroke-dasharray="2 5">
        <line x1="50" y1="126.7" x2="736" y2="126.7"/>
        <line x1="50" y1="83.3"  x2="736" y2="83.3"/>
        <line x1="50" y1="40"    x2="736" y2="40"/>
        <line x1="50" y1="203.1" x2="736" y2="203.1"/>
        <line x1="50" y1="236.1" x2="736" y2="236.1"/>
      </g>
      <g font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#4e7a76" text-anchor="end">
        <text x="44" y="174">0</text>
        <text x="44" y="130">700</text>
        <text x="44" y="87">1400</text>
        <text x="44" y="44">2100</text>
        <text x="44" y="207">60</text>
        <text x="44" y="240">120</text>
      </g>
      <g font-family="Palatino Linotype,Georgia,serif" font-size="11" letter-spacing="2" fill="#67938d">
        <text x="50" y="18">VISITS &#8593;</text>
        <text x="50" y="254">SIGNUPS &#8595;</text>
      </g>

      <g fill="url(#gV)" filter="url(#glowV)">
        <rect x="72"  y="82.1" width="54" height="87.9"  rx="7"/>
        <rect x="170" y="71"   width="54" height="99"    rx="7"/>
        <rect x="268" y="59.8" width="54" height="110.2" rx="7"/>
        <rect x="366" y="68.5" width="54" height="101.5" rx="7"/>
        <rect x="464" y="51.1" width="54" height="118.9" rx="7"/>
        <rect x="562" y="45"   width="54" height="125"   rx="7"/>
        <rect x="660" y="40"   width="54" height="130"   rx="7"/>
      </g>
      <g fill="url(#gS)" filter="url(#glowS)">
        <rect x="72"  y="170" width="54" height="31.4" rx="6"/>
        <rect x="170" y="170" width="54" height="39.7" rx="6"/>
        <rect x="268" y="170" width="54" height="49.1" rx="6"/>
        <rect x="366" y="170" width="54" height="40.8" rx="6"/>
        <rect x="464" y="170" width="54" height="52.9" rx="6"/>
        <rect x="562" y="170" width="54" height="60.1" rx="6"/>
        <rect x="660" y="170" width="54" height="70"   rx="6"/>
      </g>

      <line x1="50" y1="170" x2="736" y2="170" stroke="#3ef0c0" stroke-width="5" opacity=".15"/>
      <line x1="50" y1="170" x2="736" y2="170" stroke="#3ef0c0" stroke-width="1.5" opacity=".7"/>

      <g font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#bfe9de" text-anchor="middle">
        <text x="99"  y="74">1,420</text>
        <text x="197" y="63">1,600</text>
        <text x="295" y="52">1,780</text>
        <text x="393" y="60">1,640</text>
        <text x="491" y="43">1,920</text>
        <text x="589" y="37">2,020</text>
        <text x="687" y="32">2,100</text>
      </g>
      <g font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#c3b2f9" text-anchor="middle">
        <text x="99"  y="217">57</text>
        <text x="197" y="226">72</text>
        <text x="295" y="235">89</text>
        <text x="393" y="227">74</text>
        <text x="491" y="239">96</text>
        <text x="589" y="246">109</text>
        <text x="687" y="256">127</text>
      </g>

      <g font-family="Palatino Linotype,Georgia,serif" font-size="13" fill="#67938d" text-anchor="middle">
        <text x="99"  y="282">Mon</text>
        <text x="197" y="282">Tue</text>
        <text x="295" y="282">Wed</text>
        <text x="393" y="282">Thu</text>
        <text x="491" y="282">Fri</text>
        <text x="589" y="282">Sat</text>
        <text x="687" y="282">Sun</text>
      </g>
      <text x="44" y="300" font-family="Palatino Linotype,Georgia,serif" font-size="10" letter-spacing="1.5" fill="#67938d" text-anchor="end">CONV</text>
      <g font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#c9e8e0" text-anchor="middle">
        <text x="99"  y="300">4.0%</text>
        <text x="197" y="300">4.5%</text>
        <text x="295" y="300">5.0%</text>
        <text x="393" y="300">4.5%</text>
        <text x="491" y="300">5.0%</text>
        <text x="589" y="300">5.4%</text>
        <text x="687" y="300">6.0%</text>
      </g>
    </svg>
  </section>

  <section>
    <h2>Sources</h2>
    <div class="srcgrid">
      <span></span><span></span>
      <span class="h num">Visits</span>
      <span class="h num">Signups</span>
      <span class="h num">Conv</span>

      <span class="name">Direct</span>
      <span class="bars">
        <span class="track"><span class="fill" style="width:100%"></span></span>
        <span class="track st"><span class="fill sf" style="width:100%"></span></span>
      </span>
      <span class="num v">5,240</span>
      <span class="num s">314</span>
      <span class="num c">6.0%</span>

      <span class="name">Search</span>
      <span class="bars">
        <span class="track"><span class="fill" style="width:85.5%"></span></span>
        <span class="track st"><span class="fill sf" style="width:71.3%"></span></span>
      </span>
      <span class="num v">4,480</span>
      <span class="num s">224</span>
      <span class="num c">5.0%</span>

      <span class="name">Social</span>
      <span class="bars">
        <span class="track"><span class="fill" style="width:52.7%"></span></span>
        <span class="track st"><span class="fill sf" style="width:27.4%"></span></span>
      </span>
      <span class="num v">2,760</span>
      <span class="num s">86</span>
      <span class="num c">3.1%</span>
    </div>
  </section>
</main>
</body>
</html>
