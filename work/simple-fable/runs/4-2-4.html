<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 01</title>
<style>
  :root{
    --bg:#141418;
    --panel:#1c1c22;
    --board:#17171c;
    --line:#2c2c35;
    --ink:#f4f1ea;
    --dim:#9a9aa6;
    --mustard:#ffc72c;
    --ketchup:#e8402a;
    --ketchup-text:#ff7a5f;
    --display:"Haettenschweiler","Arial Narrow Bold","Arial Narrow",Impact,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font:15px/1.4 Arial,Helvetica,sans-serif;
  }
  .checker{
    height:14px;
    background:conic-gradient(#efece4 25%, #141418 0 50%, #efece4 0 75%, #141418 0);
    background-size:18px 18px;
  }
  .stripe{
    height:10px;
    background:repeating-linear-gradient(115deg,
      var(--ketchup) 0 22px, transparent 22px 30px,
      var(--mustard) 30px 52px, transparent 52px 60px);
  }
  main{max-width:900px;margin:0 auto;padding:22px 16px 36px;}
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .mark{
    display:inline-block;
    font-family:var(--display);
    font-style:italic;
    text-transform:uppercase;
    letter-spacing:.08em;
    font-size:15px;
    color:#fff;
    background:var(--ketchup);
    padding:3px 12px 4px 9px;
    clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%);
  }
  h1{
    font-family:var(--display);
    font-style:italic;
    text-transform:uppercase;
    font-size:clamp(44px,9vw,72px);
    line-height:.95;
    margin:8px 0 0;
    display:flex;
    align-items:baseline;
    gap:.18em;
  }
  .plate{
    background:var(--mustard);
    color:#141418;
    padding:0 .16em 0 .12em;
    border-radius:.1em;
    box-shadow:0 0 20px rgba(255,199,44,.25);
  }
  .badge{
    border:1px solid var(--line);
    color:var(--dim);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    padding:4px 9px;
    white-space:nowrap;
    margin-top:4px;
  }
  .board{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    background:var(--board);
    border:1px solid var(--line);
    border-top:3px solid var(--ketchup);
    margin:22px 0 2px;
  }
  .board > div{padding:12px 14px 10px;}
  .board > div + div{border-left:1px solid var(--line);}
  .board .k{
    font-size:10px;
    color:var(--ketchup-text);
    letter-spacing:.16em;
    text-transform:uppercase;
    font-weight:bold;
  }
  .board .v{
    font-family:var(--display);
    font-size:clamp(30px,6vw,48px);
    line-height:1.05;
    color:var(--mustard);
    text-shadow:0 0 16px rgba(255,199,44,.35);
  }
  section{
    background:var(--panel);
    border:1px solid var(--line);
    padding:16px;
    margin-top:14px;
  }
  h2{
    font-family:var(--display);
    font-style:italic;
    text-transform:uppercase;
    letter-spacing:.05em;
    font-size:20px;
    margin:0 0 12px;
  }
  h2::before{
    content:"";
    display:inline-block;
    width:18px;height:12px;
    margin-right:9px;
    background:conic-gradient(#efece4 25%, transparent 0 50%, #efece4 0 75%, transparent 0);
    background-size:6px 6px;
    clip-path:polygon(0 0,100% 0,calc(100% - 5px) 100%,5px 100%);
  }
  .scroll{overflow-x:auto;}
  .scroll svg{display:block;width:100%;min-width:600px;height:auto;}
  .src{
    display:grid;
    grid-template-columns:64px minmax(90px,1fr) 72px 64px 52px;
    gap:10px;
    align-items:center;
    padding:8px 0;
    border-top:1px solid var(--line);
  }
  .src.head{border-top:0;padding:0 0 4px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);}
  .src.head .conv{font-weight:normal;}
  .src.head small{display:block;font-size:9px;letter-spacing:.08em;color:#6f6f7a;}
  .name{font-family:var(--display);font-size:17px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;}
  .flag{vertical-align:-2px;}
  .sw{display:inline-block;width:8px;height:8px;margin-right:4px;}
  .sw.v{background:var(--mustard);}
  .sw.s{background:var(--ketchup);height:5px;}
  .bars{display:grid;gap:3px;}
  .bar{height:14px;background:#26262d;clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%);}
  .bar i{display:block;height:100%;background:var(--mustard);clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%);}
  .bar.s{height:6px;clip-path:none;}
  .bar.s i{background:var(--ketchup);clip-path:none;}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .conv{text-align:right;font-weight:bold;font-variant-numeric:tabular-nums;}
  .up{color:var(--mustard);}
  .down{color:var(--ketchup-text);}
</style>
</head>
<body>
<div class="checker"></div>
<main>
  <header>
    <div>
      <span class="mark">Drive-Thru GP</span>
      <h1>Week <span class="plate">01</span></h1>
    </div>
    <span class="badge">Synthetic data</span>
  </header>
  <div class="stripe" style="margin-top:16px"></div>

  <div class="board">
    <div><div class="k">Visits</div><div class="v">12,480</div></div>
    <div><div class="k">Signups</div><div class="v">624</div></div>
    <div><div class="k">Conversion</div><div class="v">5.0%</div></div>
  </div>

  <section>
    <h2>By day</h2>
    <div class="scroll">
      <svg viewBox="0 0 720 374" role="img" aria-label="Visits, signups and conversion by day, Monday to Sunday. Sunday is the best day: 2,100 visits, 127 signups, 6.0% conversion. Week average conversion is 5.0%.">
        <defs>
          <pattern id="finish" width="8" height="8" patternUnits="userSpaceOnUse">
            <rect width="4" height="4" fill="#d9d6cc"/>
            <rect x="4" y="4" width="4" height="4" fill="#d9d6cc"/>
          </pattern>
        </defs>
        <!-- visits -->
        <text x="56" y="108" text-anchor="end" font-size="11" letter-spacing="2" fill="#9a9aa6">VISITS</text>
        <rect x="80"  y="75"   width="60" height="115"   fill="#ffc72c"/>
        <rect x="172" y="60.5" width="60" height="129.5" fill="#ffc72c"/>
        <rect x="264" y="45.9" width="60" height="144.1" fill="#ffc72c"/>
        <rect x="356" y="57.2" width="60" height="132.8" fill="#ffc72c"/>
        <rect x="448" y="34.6" width="60" height="155.4" fill="#ffc72c"/>
        <rect x="540" y="26.5" width="60" height="163.5" fill="#ffc72c"/>
        <rect x="632" y="20"   width="60" height="170"   fill="#ffc72c"/>
        <text x="110" y="68"   text-anchor="middle" font-size="14" font-weight="bold" fill="#f4f1ea">1,420</text>
        <text x="202" y="53.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#f4f1ea">1,600</text>
        <text x="294" y="38.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#f4f1ea">1,780</text>
        <text x="386" y="50.2" text-anchor="middle" font-size="14" font-weight="bold" fill="#f4f1ea">1,640</text>
        <text x="478" y="27.6" text-anchor="middle" font-size="14" font-weight="bold" fill="#f4f1ea">1,920</text>
        <text x="570" y="19.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#f4f1ea">2,020</text>
        <text x="662" y="13"   text-anchor="middle" font-size="14" font-weight="bold" fill="#f4f1ea">2,100</text>
        <rect x="70" y="190" width="632" height="8" fill="url(#finish)" opacity="0.85"/>
        <!-- days -->
        <text x="110" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#d8d8e0">Mon</text>
        <text x="202" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#d8d8e0">Tue</text>
        <text x="294" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#d8d8e0">Wed</text>
        <text x="386" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#d8d8e0">Thu</text>
        <text x="478" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#d8d8e0">Fri</text>
        <text x="570" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#d8d8e0">Sat</text>
        <text x="662" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffc72c">Sun</text>
        <!-- checkered flag on the best day -->
        <line x1="681" y1="203" x2="681" y2="217" stroke="#d8d8e0" stroke-width="1.5"/>
        <rect x="682" y="203" width="14" height="8" fill="#efece4"/>
        <rect x="682" y="203" width="3.5" height="4" fill="#141418"/>
        <rect x="689" y="203" width="3.5" height="4" fill="#141418"/>
        <rect x="685.5" y="207" width="3.5" height="4" fill="#141418"/>
        <rect x="692.5" y="207" width="3.5" height="4" fill="#141418"/>
        <!-- signups (own scale, narrower bars) -->
        <text x="56" y="295" text-anchor="end" font-size="11" letter-spacing="2" fill="#9a9aa6">SIGNUPS</text>
        <rect x="92"  y="295.1" width="36" height="44.9"  fill="#e8402a"/>
        <rect x="184" y="283.3" width="36" height="56.7"  fill="#e8402a"/>
        <rect x="276" y="269.9" width="36" height="70.1"  fill="#e8402a"/>
        <rect x="368" y="281.7" width="36" height="58.3"  fill="#e8402a"/>
        <rect x="460" y="264.4" width="36" height="75.6"  fill="#e8402a"/>
        <rect x="552" y="254.2" width="36" height="85.8"  fill="#e8402a"/>
        <rect x="644" y="240"   width="36" height="100"   fill="#e8402a"/>
        <text x="110" y="288.1" text-anchor="middle" font-size="14" font-weight="bold" fill="#f4f1ea">57</text>
        <text x="202" y="276.3" text-anchor="middle" font-size="14" font-weight="bold" fill="#f4f1ea">72</text>
        <text x="294" y="262.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#f4f1ea">89</text>
        <text x="386" y="274.7" text-anchor="middle" font-size="14" font-weight="bold" fill="#f4f1ea">74</text>
        <text x="478" y="257.4" text-anchor="middle" font-size="14" font-weight="bold" fill="#f4f1ea">96</text>
        <text x="570" y="247.2" text-anchor="middle" font-size="14" font-weight="bold" fill="#f4f1ea">109</text>
        <text x="662" y="233"   text-anchor="middle" font-size="14" font-weight="bold" fill="#f4f1ea">127</text>
        <rect x="70" y="340" width="632" height="8" fill="url(#finish)" opacity="0.85"/>
        <!-- conversion, anchored to the week average -->
        <text x="56" y="358" text-anchor="end" font-size="11" letter-spacing="2" fill="#9a9aa6">CONV</text>
        <text x="56" y="370" text-anchor="end" font-size="9" letter-spacing="1" fill="#6f6f7a">WK 5.0%</text>
        <text x="110" y="364" text-anchor="middle" font-size="13" fill="#a8a8b4">4.0%</text>
        <text x="202" y="364" text-anchor="middle" font-size="13" fill="#a8a8b4">4.5%</text>
        <text x="294" y="364" text-anchor="middle" font-size="13" fill="#a8a8b4">5.0%</text>
        <text x="386" y="364" text-anchor="middle" font-size="13" fill="#a8a8b4">4.5%</text>
        <text x="478" y="364" text-anchor="middle" font-size="13" fill="#a8a8b4">5.0%</text>
        <text x="570" y="364" text-anchor="middle" font-size="13" fill="#a8a8b4">5.4%</text>
        <text x="662" y="364" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffc72c">6.0%</text>
      </svg>
    </div>
  </section>

  <section>
    <h2>By source</h2>
    <div role="table" aria-label="Sources">
      <div class="src head" role="row">
        <span role="columnheader" aria-label="Source"></span>
        <span aria-hidden="true"></span>
        <span class="num" role="columnheader"><i class="sw v" aria-hidden="true"></i>Visits</span>
        <span class="num" role="columnheader"><i class="sw s" aria-hidden="true"></i>Signups</span>
        <span class="conv" role="columnheader">Conv<small>wk 5.0%</small></span>
      </div>
      <div class="src" role="row">
        <span class="name" role="cell">Direct
          <svg class="flag" viewBox="0 0 15 16" width="15" height="16" role="img" aria-label="Best source">
            <line x1="1" y1="1" x2="1" y2="15" stroke="#d8d8e0" stroke-width="1.5"/>
            <rect x="2" y="1" width="12" height="8" fill="#efece4"/>
            <rect x="2" y="1" width="3" height="4" fill="#141418"/>
            <rect x="8" y="1" width="3" height="4" fill="#141418"/>
            <rect x="5" y="5" width="3" height="4" fill="#141418"/>
            <rect x="11" y="5" width="3" height="4" fill="#141418"/>
          </svg>
        </span>
        <span class="bars" aria-hidden="true">
          <span class="bar" title="Visits"><i style="width:100%"></i></span>
          <span class="bar s" title="Signups, same scale"><i style="width:6%"></i></span>
        </span>
        <span class="num" role="cell">5,240</span>
        <span class="num" role="cell">314</span>
        <span class="conv up" role="cell">6.0%</span>
      </div>
      <div class="src" role="row">
        <span class="name" role="cell">Search</span>
        <span class="bars" aria-hidden="true">
          <span class="bar" title="Visits"><i style="width:85.5%"></i></span>
          <span class="bar s" title="Signups, same scale"><i style="width:4.3%"></i></span>
        </span>
        <span class="num" role="cell">4,480</span>
        <span class="num" role="cell">224</span>
        <span class="conv" role="cell">5.0%</span>
      </div>
      <div class="src" role="row">
        <span class="name" role="cell">Social</span>
        <span class="bars" aria-hidden="true">
          <span class="bar" title="Visits"><i style="width:52.7%"></i></span>
          <span class="bar s" title="Signups, same scale"><i style="width:1.6%"></i></span>
        </span>
        <span class="num" role="cell">2,760</span>
        <span class="num" role="cell">86</span>
        <span class="conv down" role="cell">3.1%</span>
      </div>
    </div>
  </section>
</main>
</body>
</html>
