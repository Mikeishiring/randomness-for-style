<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Site Weather — Week 01</title>
<style>
  :root{
    --bg:#0a1120;
    --panel:#0c1628;
    --ink:#e9effb;
    --dim:#8da0bf;
    --faint:#5c6e8d;
    --line:rgba(150,180,230,.14);
    --amber:#fbbf24;
    --amber-soft:#ffd889;
    --cyan:#38bdf8;
    --cyan-soft:#7dd3fc;
    --cloud:#9db1d6;
    --mono:ui-monospace,"Cascadia Code",Consolas,"SF Mono",Menlo,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 420px at 85% -10%, rgba(251,191,36,.08), transparent 60%),
      radial-gradient(700px 520px at -10% 10%, rgba(56,189,248,.07), transparent 60%),
      radial-gradient(rgba(141,160,191,.13) 1px, transparent 1.3px);
    background-size:auto,auto,26px 26px;
    background-color:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    padding:28px 20px 48px;
  }
  .page{max-width:1000px;margin:0 auto}
  .micro{
    font:600 10.5px var(--mono);
    letter-spacing:.17em;
    text-transform:uppercase;
    color:var(--dim);
  }
  /* header */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .wordmark{display:flex;align-items:center;gap:9px;font:700 13px var(--sans);letter-spacing:.22em}
  .period{display:flex;align-items:center;gap:12px}
  .week{font:600 14px var(--mono);font-variant-numeric:tabular-nums}
  .chip{
    font:600 10px var(--mono);letter-spacing:.18em;color:var(--dim);
    border:1px dashed rgba(141,160,191,.45);border-radius:999px;padding:4px 10px 3px;
  }
  .stats{display:flex;flex-wrap:wrap;gap:14px 44px;margin-top:26px}
  .stat{display:flex;flex-direction:column;gap:4px}
  .stat .value{
    font:650 clamp(26px,4.5vw,32px)/1.1 var(--mono);
    font-variant-numeric:tabular-nums;
    display:flex;align-items:center;gap:9px;
  }
  .stat .sub{font:500 12px var(--mono);color:var(--dim);font-variant-numeric:tabular-nums}
  /* cards */
  main{display:grid;gap:16px;margin-top:26px}
  .card{
    background:linear-gradient(180deg, rgba(21,34,58,.92), rgba(14,24,43,.92));
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px;
  }
  .cardtitle{margin-bottom:12px}
  /* instrument screen panel with scroll shadows */
  .scroll{
    overflow-x:auto;
    border:1px solid rgba(150,180,230,.1);
    border-radius:10px;
    padding:10px 6px;
    background:
      linear-gradient(90deg, var(--panel) 30%, rgba(12,22,40,0)) left center / 32px 100% no-repeat local,
      linear-gradient(270deg, var(--panel) 30%, rgba(12,22,40,0)) right center / 32px 100% no-repeat local,
      radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.5), transparent) left center / 16px 100% no-repeat scroll,
      radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.5), transparent) right center / 16px 100% no-repeat scroll,
      var(--panel);
  }
  svg.week-strip{display:block;width:100%;min-width:760px}
  /* strip text */
  .t-day{font:600 11px var(--mono);letter-spacing:.2em;fill:var(--dim)}
  .t-band{font:600 10px var(--mono);letter-spacing:.18em;fill:var(--faint)}
  .t-band-v{fill:rgba(251,191,36,.55)}
  .t-band-s{fill:rgba(125,211,252,.5)}
  .t-cond{font:600 16px var(--mono);fill:var(--ink)}
  .t-visit{font:600 14.5px var(--mono);fill:var(--amber-soft)}
  .t-sign{font:600 13px var(--mono);fill:var(--cyan-soft)}
  /* shared condition key between the two cards */
  .key{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:0 18px}
  .scale{width:min(420px,100%);height:auto;display:block}
  .t-tick{font:500 9.5px var(--mono);fill:var(--dim)}
  .t-tick-end{fill:var(--faint)}
  .wx{display:inline-block;vertical-align:middle}
  /* sources */
  .tbl{display:grid}
  .thead,.trow{
    display:grid;
    grid-template-columns:1.3fr .9fr .8fr .7fr;
    gap:8px;align-items:center;
    padding:10px 12px;
  }
  .thead{padding-top:0;padding-bottom:8px}
  .thead span{
    font:600 10px var(--mono);letter-spacing:.17em;text-transform:uppercase;color:var(--dim);
  }
  .sw{
    display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px;
    background:linear-gradient(90deg, rgba(251,191,36,.8), rgba(251,191,36,.25));
  }
  .trow{position:relative;border-top:1px solid var(--line)}
  .trow::before{
    content:"";position:absolute;inset:5px auto 5px 0;width:var(--w);
    background:linear-gradient(90deg, rgba(251,191,36,.15), rgba(251,191,36,.04));
    border-right:1px solid rgba(251,191,36,.4);
    border-radius:0 4px 4px 0;
  }
  .trow>*{position:relative}
  .name{font:600 13.5px var(--sans)}
  .r{text-align:right;font:600 13.5px var(--mono);font-variant-numeric:tabular-nums}
  .r.conv{display:flex;align-items:center;justify-content:flex-end;gap:7px;color:var(--dim)}
  @media (max-width:560px){
    body{padding:20px 14px 36px}
    .stats{gap:12px 28px}
    .card{padding:14px 12px}
    .key{padding:0 12px}
    .name{font-size:12.5px}
    .r{font-size:12.5px}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="wx-cloudshape">
      <circle cx="-9" cy="3.5" r="8"/>
      <circle cx="2" cy="-3" r="10.5"/>
      <circle cx="11" cy="4" r="7.5"/>
      <rect x="-9" y="3.5" width="20" height="8"/>
    </g>
    <symbol id="wx-sun" viewBox="-26 -26 52 52">
      <circle r="19" fill="#fbbf24" opacity=".15"/>
      <circle r="10.5" fill="#fbbf24"/>
      <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round">
        <line x1="15" y1="0" x2="21" y2="0"/><line x1="-15" y1="0" x2="-21" y2="0"/>
        <line x1="0" y1="15" x2="0" y2="21"/><line x1="0" y1="-15" x2="0" y2="-21"/>
        <line x1="10.6" y1="10.6" x2="14.8" y2="14.8"/><line x1="-10.6" y1="-10.6" x2="-14.8" y2="-14.8"/>
        <line x1="10.6" y1="-10.6" x2="14.8" y2="-14.8"/><line x1="-10.6" y1="10.6" x2="-14.8" y2="14.8"/>
      </g>
    </symbol>
    <symbol id="wx-suncloud" viewBox="-26 -26 52 52">
      <g transform="translate(-5,-7)">
        <circle r="8.5" fill="#fbbf24"/>
        <g stroke="#fbbf24" stroke-width="2.6" stroke-linecap="round">
          <line x1="12" y1="0" x2="17" y2="0"/><line x1="-12" y1="0" x2="-17" y2="0"/>
          <line x1="0" y1="12" x2="0" y2="17"/><line x1="0" y1="-12" x2="0" y2="-17"/>
          <line x1="8.5" y1="8.5" x2="12" y2="12"/><line x1="-8.5" y1="-8.5" x2="-12" y2="-12"/>
          <line x1="8.5" y1="-8.5" x2="12" y2="-12"/><line x1="-8.5" y1="8.5" x2="-12" y2="12"/>
        </g>
      </g>
      <use href="#wx-cloudshape" fill="#9db1d6" transform="translate(6,7) scale(.8)"/>
    </symbol>
    <symbol id="wx-cloudsun" viewBox="-26 -26 52 52">
      <g transform="translate(-8,-9)">
        <circle r="6.5" fill="#fbbf24"/>
        <g stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round">
          <line x1="9.5" y1="0" x2="13.5" y2="0"/><line x1="-9.5" y1="0" x2="-13.5" y2="0"/>
          <line x1="0" y1="-9.5" x2="0" y2="-13.5"/>
          <line x1="6.7" y1="-6.7" x2="9.5" y2="-9.5"/><line x1="-6.7" y1="-6.7" x2="-9.5" y2="-9.5"/>
        </g>
      </g>
      <use href="#wx-cloudshape" fill="#9db1d6" transform="translate(2,3) scale(1.05)"/>
    </symbol>
    <symbol id="wx-cloud" viewBox="-26 -26 52 52">
      <use href="#wx-cloudshape" fill="#718ab2" opacity=".75" transform="translate(7,-8) scale(.75)"/>
      <use href="#wx-cloudshape" fill="#9db1d6" transform="translate(-1,1) scale(1.3)"/>
    </symbol>
    <linearGradient id="gradSign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="gradScale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9db1d6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity=".8"/>
    </linearGradient>
  </defs>
</svg>

<div class="page">
<header>
  <div class="topbar">
    <h1 class="wordmark">
      <svg class="wx" width="18" height="18" viewBox="0 0 52 52" aria-hidden="true"><use href="#wx-sun" width="52" height="52"/></svg>
      SITE WEATHER
    </h1>
    <div class="period">
      <span class="chip">SYNTHETIC</span>
      <span class="week">Week 01</span>
    </div>
  </div>
  <div class="stats">
    <div class="stat">
      <span class="micro">Visits</span>
      <span class="value">12,480</span>
      <span class="sub">H 2,100 SUN · L 1,420 MON</span>
    </div>
    <div class="stat">
      <span class="micro">Signups</span>
      <span class="value">624</span>
      <span class="sub">H 127 SUN · L 57 MON</span>
    </div>
    <div class="stat">
      <span class="micro">Conversion</span>
      <span class="value">5.0%
        <svg class="wx" width="22" height="22" viewBox="0 0 52 52" aria-hidden="true"><use href="#wx-suncloud" width="52" height="52"/></svg>
      </span>
      <span class="sub">H 6.0% SUN · L 4.0% MON</span>
    </div>
  </div>
</header>

<main>
<section class="card">
  <div class="scroll">
  <svg class="week-strip" viewBox="0 0 980 332" role="img"
       aria-label="Daily strip, Monday to Sunday, in three bands: conversion with weather conditions, visits curve, signup bars. Conversion rises from 4.0% to 6.0%, visits from 1,420 to 2,100, signups from 57 to 127.">
    <!-- day labels -->
    <g text-anchor="middle">
      <text class="t-day" x="70" y="18">MON</text>
      <text class="t-day" x="210" y="18">TUE</text>
      <text class="t-day" x="350" y="18">WED</text>
      <text class="t-day" x="490" y="18">THU</text>
      <text class="t-day" x="630" y="18">FRI</text>
      <text class="t-day" x="770" y="18">SAT</text>
      <text class="t-day" x="910" y="18">SUN</text>
    </g>
    <!-- condition band: glyph + conversion headline -->
    <use href="#wx-cloud"    x="46"  y="24" width="48" height="48"/>
    <use href="#wx-cloudsun" x="186" y="24" width="48" height="48"/>
    <use href="#wx-suncloud" x="326" y="24" width="48" height="48"/>
    <use href="#wx-cloudsun" x="466" y="24" width="48" height="48"/>
    <use href="#wx-suncloud" x="606" y="24" width="48" height="48"/>
    <use href="#wx-sun"      x="746" y="24" width="48" height="48"/>
    <use href="#wx-sun"      x="886" y="24" width="48" height="48"/>
    <text class="t-band" x="8" y="93">CONV</text>
    <g text-anchor="middle">
      <text class="t-cond" x="70"  y="93">4.0%</text>
      <text class="t-cond" x="210" y="93">4.5%</text>
      <text class="t-cond" x="350" y="93">5.0%</text>
      <text class="t-cond" x="490" y="93">4.5%</text>
      <text class="t-cond" x="630" y="93">5.0%</text>
      <text class="t-cond" x="770" y="93">5.4%</text>
      <text class="t-cond" x="910" y="93">6.0%</text>
    </g>
    <!-- visits band -->
    <text class="t-band t-band-v" x="8" y="120">VISITS</text>
    <path fill="none" stroke="#fbbf24" stroke-opacity=".16" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"
          d="M70,227.3 L210,202.5 L350,177.8 L490,197 L630,158.5 L770,144.8 L910,133.8"/>
    <path fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"
          d="M70,227.3 L210,202.5 L350,177.8 L490,197 L630,158.5 L770,144.8 L910,133.8"/>
    <g fill="#fbbf24" stroke="#0c1628" stroke-width="1.5">
      <circle cx="70"  cy="227.3" r="3.5"/>
      <circle cx="210" cy="202.5" r="3.5"/>
      <circle cx="350" cy="177.8" r="3.5"/>
      <circle cx="490" cy="197"   r="3.5"/>
      <circle cx="630" cy="158.5" r="3.5"/>
      <circle cx="770" cy="144.8" r="3.5"/>
      <circle cx="910" cy="133.8" r="4.5"/>
    </g>
    <g text-anchor="middle">
      <text class="t-visit" x="70"  y="215.3">1,420</text>
      <text class="t-visit" x="210" y="190.5">1,600</text>
      <text class="t-visit" x="350" y="165.8">1,780</text>
      <text class="t-visit" x="490" y="185">1,640</text>
      <text class="t-visit" x="630" y="146.5">1,920</text>
      <text class="t-visit" x="770" y="132.8">2,020</text>
      <text class="t-visit" x="910" y="121.8">2,100</text>
    </g>
    <!-- signups band -->
    <text class="t-band t-band-s" x="8" y="252">SIGNUPS</text>
    <g fill="url(#gradSign)">
      <rect x="48"  y="284.5" width="44" height="21.5" rx="2"/>
      <rect x="188" y="278.8" width="44" height="27.2" rx="2"/>
      <rect x="328" y="272.4" width="44" height="33.6" rx="2"/>
      <rect x="468" y="278"   width="44" height="28"   rx="2"/>
      <rect x="608" y="269.7" width="44" height="36.3" rx="2"/>
      <rect x="748" y="264.8" width="44" height="41.2" rx="2"/>
      <rect x="888" y="258"   width="44" height="48"   rx="2"/>
    </g>
    <line x1="36" y1="306" x2="926" y2="306" stroke="rgba(150,180,230,.2)"/>
    <g text-anchor="middle">
      <text class="t-sign" x="70"  y="324">57</text>
      <text class="t-sign" x="210" y="324">72</text>
      <text class="t-sign" x="350" y="324">89</text>
      <text class="t-sign" x="490" y="324">74</text>
      <text class="t-sign" x="630" y="324">96</text>
      <text class="t-sign" x="770" y="324">109</text>
      <text class="t-sign" x="910" y="324">127</text>
    </g>
  </svg>
  </div>
</section>

<div class="key">
  <span class="micro">Conditions = conversion %</span>
  <svg class="scale" viewBox="0 0 420 56" role="img"
       aria-label="Condition scale: cloud below 4.25% conversion, cloud with sun 4.25 to 4.75%, sun with cloud 4.75 to 5.25%, sun above 5.25%.">
    <use href="#wx-cloud"    x="76.8"  y="4" width="17" height="17"/>
    <use href="#wx-cloudsun" x="173.8" y="4" width="17" height="17"/>
    <use href="#wx-suncloud" x="229.2" y="4" width="17" height="17"/>
    <use href="#wx-sun"      x="326.2" y="4" width="17" height="17"/>
    <rect x="16" y="28" width="388" height="7" rx="3.5" fill="url(#gradScale)"/>
    <g stroke="#0a1120" stroke-width="2">
      <line x1="154.6" y1="26.5" x2="154.6" y2="36.5"/>
      <line x1="210"   y1="26.5" x2="210"   y2="36.5"/>
      <line x1="265.4" y1="26.5" x2="265.4" y2="36.5"/>
    </g>
    <text class="t-tick t-tick-end" x="16" y="50" text-anchor="start">3.0</text>
    <text class="t-tick" x="154.6" y="50" text-anchor="middle">4.25</text>
    <text class="t-tick" x="210"   y="50" text-anchor="middle">4.75</text>
    <text class="t-tick" x="265.4" y="50" text-anchor="middle">5.25</text>
    <text class="t-tick t-tick-end" x="404" y="50" text-anchor="end">6.5</text>
  </svg>
</div>

<section class="card">
  <div class="micro cardtitle" id="sources-title">Sources</div>
  <div class="tbl" role="table" aria-labelledby="sources-title">
    <div class="thead" role="row">
      <span role="columnheader">Source</span>
      <span class="r" role="columnheader"><i class="sw"></i>Visits</span>
      <span class="r" role="columnheader">Signups</span>
      <span class="r" role="columnheader">Conv</span>
    </div>
    <div class="trow" role="row" style="--w:100%">
      <span class="name" role="cell">Direct</span>
      <span class="r" role="cell">5,240</span><span class="r" role="cell">314</span>
      <span class="r conv" role="cell"><svg class="wx" width="16" height="16" viewBox="0 0 52 52" aria-hidden="true"><use href="#wx-sun" width="52" height="52"/></svg>6.0%</span>
    </div>
    <div class="trow" role="row" style="--w:85.5%">
      <span class="name" role="cell">Search</span>
      <span class="r" role="cell">4,480</span><span class="r" role="cell">224</span>
      <span class="r conv" role="cell"><svg class="wx" width="16" height="16" viewBox="0 0 52 52" aria-hidden="true"><use href="#wx-suncloud" width="52" height="52"/></svg>5.0%</span>
    </div>
    <div class="trow" role="row" style="--w:52.7%">
      <span class="name" role="cell">Social</span>
      <span class="r" role="cell">2,760</span><span class="r" role="cell">86</span>
      <span class="r conv" role="cell"><svg class="wx" width="16" height="16" viewBox="0 0 52 52" aria-hidden="true"><use href="#wx-cloud" width="52" height="52"/></svg>3.1%</span>
    </div>
  </div>
</section>
</main>
</div>
</body>
</html>
