<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 01 Performance</title>
<style>
  :root{
    --bg:#0f1117;
    --panel:#171a22;
    --line:#262b36;
    --ink:#e9e4d8;
    --muted:#a39d8f;
    --faint:#6d6858;
    --gold:#c9a53f;
    --gold-bright:#d4af37;
    --marble:#c9c2b1;
  }
  html{color-scheme:dark}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
    font-variant-numeric:tabular-nums;
  }
  .band{line-height:0}
  .wrap{max-width:920px;margin:0 auto;padding:10px 20px 40px}
  header{display:flex;align-items:center;gap:14px;margin:26px 0 22px}
  header svg{flex:none}
  h1{font-size:24px;font-weight:600;margin:0;letter-spacing:.4px}
  .meta{margin-left:auto;display:flex;align-items:center;gap:12px}
  .period{font-size:13px;letter-spacing:2.2px;color:var(--gold);text-transform:uppercase}
  .chip{border:1px solid #3a3f4a;border-radius:2px;padding:3px 8px;font-size:10.5px;letter-spacing:1.4px;color:var(--muted);text-transform:uppercase}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--gold);padding:12px 14px 13px}
  .kpi .label{font-size:10.5px;letter-spacing:1.8px;color:var(--faint);text-transform:uppercase}
  .kpi .value{font-size:26px;margin-top:6px;display:flex;align-items:center;gap:7px}
  .kpi .sub{font-size:11.5px;color:#8f8a7d;margin-top:5px}
  .panel{background:var(--panel);border:1px solid var(--line);padding:16px 18px 14px;margin-bottom:12px}
  h2{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
  h2::after{content:"";flex:1;height:1px;background:var(--line)}
  .panel svg{display:block;width:100%;height:auto}
  .sources{display:grid;grid-template-columns:64px 1fr 64px 70px 108px;gap:9px 14px;align-items:center;font-size:13.5px}
  .shead{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint)}
  .sname{color:var(--ink)}
  .track{height:13px;background:#20242e}
  .fill{height:100%;background:var(--marble)}
  .num{text-align:right;color:var(--ink)}
  .conv{display:flex;align-items:center;gap:8px}
  .ctrack{width:56px;height:9px;background:#20242e;flex:none}
  .cfill{height:100%;background:var(--gold)}
  .cval{color:#d2b14e;width:38px;text-align:right}
  @media (max-width:640px){
    h1{font-size:19px}
    .kpis{grid-template-columns:1fr 1fr}
    .sources{grid-template-columns:52px 1fr 52px 56px 92px;gap:8px 8px;font-size:12px}
    .ctrack{width:40px}
    .cval{width:32px}
  }
</style>
</head>
<body>

<div class="band" aria-hidden="true">
  <svg width="100%" height="18">
    <defs>
      <pattern id="m1" width="20" height="18" patternUnits="userSpaceOnUse">
        <path d="M0 3 H20 M19 3 V13 M19 13 H8 M8 13 V8 M8 8 H14 M0 16 H20" fill="none" stroke="#b9953a" stroke-width="2"/>
      </pattern>
    </defs>
    <rect width="100%" height="18" fill="url(#m1)"/>
  </svg>
</div>

<div class="wrap">

  <header>
    <svg width="44" height="38" viewBox="0 0 48 40" aria-hidden="true">
      <path d="M4 14 L24 2 L44 14" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M6 18 H42" stroke="var(--gold)" stroke-width="2.5"/>
      <path d="M12 21 V34 M24 21 V34 M36 21 V34" stroke="var(--gold)" stroke-width="2.5"/>
      <path d="M4 38 H44" stroke="var(--gold)" stroke-width="2.5"/>
    </svg>
    <h1>Website performance</h1>
    <div class="meta">
      <span class="period">Week 01</span>
      <span class="chip">Synthetic data</span>
    </div>
  </header>

  <div class="kpis">
    <div class="kpi">
      <div class="label">Visits</div>
      <div class="value">12,480</div>
    </div>
    <div class="kpi">
      <div class="label">Signups</div>
      <div class="value">624</div>
    </div>
    <div class="kpi">
      <div class="label">Conversion</div>
      <div class="value">5.0%</div>
      <div class="sub">4.0% Mon &#8594; 6.0% Sun</div>
    </div>
    <div class="kpi">
      <div class="label">Peak day</div>
      <div class="value">Sun
        <svg width="11" height="15" viewBox="0 0 11 15" aria-hidden="true"><path d="M7 0 L1.5 8 H4.8 L3 15 L10 5.5 H6.2 L9.5 0 Z" fill="var(--gold-bright)"/></svg>
      </div>
      <div class="sub">2,100 visits &#183; 127 signups</div>
    </div>
  </div>

  <section class="panel">
    <h2>Day by day</h2>
    <svg viewBox="0 0 720 452" role="img" aria-label="Daily visits as columns, Monday 1,420 rising to Sunday 2,100; daily signups below, 57 rising to 127; daily conversion 4.0% to 6.0%.">

      <path d="M38 165.2 H688 M38 60.5 H688" stroke="#242936" stroke-width="1" stroke-dasharray="2 4"/>
      <text x="34" y="169" font-size="10" fill="#6f6b60" text-anchor="end">1k</text>
      <text x="34" y="64" font-size="10" fill="#6f6b60" text-anchor="end">2k</text>

      <text x="4" y="50" font-size="10" letter-spacing="1.5" fill="#6d6858">VISITS</text>

      <!-- Mon 1,420 -->
      <text x="70" y="111" font-size="13" fill="#e9e4d8" text-anchor="middle">1,420</text>
      <rect x="42" y="121" width="56" height="6" fill="#d8d2c2"/>
      <rect x="46" y="127" width="48" height="5" fill="#d8d2c2"/>
      <rect x="50" y="132" width="40" height="138" fill="#c9c2b1"/>
      <path d="M60 138 V266 M70 138 V266 M80 138 V266" stroke="rgba(15,17,23,.18)" stroke-width="2"/>
      <!-- Tue 1,600 -->
      <text x="167" y="92" font-size="13" fill="#e9e4d8" text-anchor="middle">1,600</text>
      <rect x="139" y="102" width="56" height="6" fill="#d8d2c2"/>
      <rect x="143" y="108" width="48" height="5" fill="#d8d2c2"/>
      <rect x="147" y="113" width="40" height="157" fill="#c9c2b1"/>
      <path d="M157 119 V266 M167 119 V266 M177 119 V266" stroke="rgba(15,17,23,.18)" stroke-width="2"/>
      <!-- Wed 1,780 -->
      <text x="264" y="73" font-size="13" fill="#e9e4d8" text-anchor="middle">1,780</text>
      <rect x="236" y="83" width="56" height="6" fill="#d8d2c2"/>
      <rect x="240" y="89" width="48" height="5" fill="#d8d2c2"/>
      <rect x="244" y="94" width="40" height="176" fill="#c9c2b1"/>
      <path d="M254 100 V266 M264 100 V266 M274 100 V266" stroke="rgba(15,17,23,.18)" stroke-width="2"/>
      <!-- Thu 1,640 -->
      <text x="361" y="88" font-size="13" fill="#e9e4d8" text-anchor="middle">1,640</text>
      <rect x="333" y="98" width="56" height="6" fill="#d8d2c2"/>
      <rect x="337" y="104" width="48" height="5" fill="#d8d2c2"/>
      <rect x="341" y="109" width="40" height="161" fill="#c9c2b1"/>
      <path d="M351 115 V266 M361 115 V266 M371 115 V266" stroke="rgba(15,17,23,.18)" stroke-width="2"/>
      <!-- Fri 1,920 -->
      <text x="458" y="59" font-size="13" fill="#e9e4d8" text-anchor="middle">1,920</text>
      <rect x="430" y="69" width="56" height="6" fill="#d8d2c2"/>
      <rect x="434" y="75" width="48" height="5" fill="#d8d2c2"/>
      <rect x="438" y="80" width="40" height="190" fill="#c9c2b1"/>
      <path d="M448 86 V266 M458 86 V266 M468 86 V266" stroke="rgba(15,17,23,.18)" stroke-width="2"/>
      <!-- Sat 2,020 -->
      <text x="555" y="48" font-size="13" fill="#e9e4d8" text-anchor="middle">2,020</text>
      <rect x="527" y="58" width="56" height="6" fill="#d8d2c2"/>
      <rect x="531" y="64" width="48" height="5" fill="#d8d2c2"/>
      <rect x="535" y="69" width="40" height="201" fill="#c9c2b1"/>
      <path d="M545 75 V266 M555 75 V266 M565 75 V266" stroke="rgba(15,17,23,.18)" stroke-width="2"/>
      <!-- Sun 2,100 (peak) -->
      <text x="652" y="40" font-size="13" font-weight="bold" fill="#d9b84a" text-anchor="middle">2,100</text>
      <rect x="624" y="50" width="56" height="6" fill="#c9a53f"/>
      <rect x="628" y="56" width="48" height="5" fill="#c9a53f"/>
      <rect x="632" y="61" width="40" height="209" fill="#e8e1cf"/>
      <path d="M642 67 V266 M652 67 V266 M662 67 V266" stroke="rgba(15,17,23,.18)" stroke-width="2"/>

      <!-- stylobate -->
      <rect x="32" y="270" width="656" height="7" fill="#6e685b"/>
      <rect x="22" y="277" width="676" height="7" fill="#4c483e"/>

      <!-- day labels -->
      <text x="70" y="299" font-size="12.5" fill="#a39d8f" text-anchor="middle">Mon</text>
      <text x="167" y="299" font-size="12.5" fill="#a39d8f" text-anchor="middle">Tue</text>
      <text x="264" y="299" font-size="12.5" fill="#a39d8f" text-anchor="middle">Wed</text>
      <text x="361" y="299" font-size="12.5" fill="#a39d8f" text-anchor="middle">Thu</text>
      <text x="458" y="299" font-size="12.5" fill="#a39d8f" text-anchor="middle">Fri</text>
      <text x="555" y="299" font-size="12.5" fill="#a39d8f" text-anchor="middle">Sat</text>
      <text x="652" y="299" font-size="12.5" fill="#d4b44a" text-anchor="middle">Sun</text>

      <text x="4" y="357" font-size="10" letter-spacing="1.5" fill="#6d6858">SIGNUPS</text>

      <!-- signup bars -->
      <text x="70" y="386" font-size="12" fill="#d2b14e" text-anchor="middle">57</text>
      <rect x="50" y="393" width="40" height="27" fill="#b08f35"/>
      <text x="167" y="379" font-size="12" fill="#d2b14e" text-anchor="middle">72</text>
      <rect x="147" y="386" width="40" height="34" fill="#b08f35"/>
      <text x="264" y="371" font-size="12" fill="#d2b14e" text-anchor="middle">89</text>
      <rect x="244" y="378" width="40" height="42" fill="#b08f35"/>
      <text x="361" y="378" font-size="12" fill="#d2b14e" text-anchor="middle">74</text>
      <rect x="341" y="385" width="40" height="35" fill="#b08f35"/>
      <text x="458" y="368" font-size="12" fill="#d2b14e" text-anchor="middle">96</text>
      <rect x="438" y="375" width="40" height="45" fill="#b08f35"/>
      <text x="555" y="361" font-size="12" fill="#d2b14e" text-anchor="middle">109</text>
      <rect x="535" y="368" width="40" height="52" fill="#b08f35"/>
      <text x="652" y="353" font-size="12" font-weight="bold" fill="#d9b84a" text-anchor="middle">127</text>
      <rect x="632" y="360" width="40" height="60" fill="#d4af37"/>
      <path d="M22 420.5 H698" stroke="#2a2f3b" stroke-width="1"/>

      <!-- daily conversion -->
      <text x="4" y="441" font-size="10" letter-spacing="1.5" fill="#6d6858">CONV.</text>
      <text x="70" y="441" font-size="11" fill="#87816f" text-anchor="middle">4.0%</text>
      <text x="167" y="441" font-size="11" fill="#87816f" text-anchor="middle">4.5%</text>
      <text x="264" y="441" font-size="11" fill="#87816f" text-anchor="middle">5.0%</text>
      <text x="361" y="441" font-size="11" fill="#87816f" text-anchor="middle">4.5%</text>
      <text x="458" y="441" font-size="11" fill="#87816f" text-anchor="middle">5.0%</text>
      <text x="555" y="441" font-size="11" fill="#87816f" text-anchor="middle">5.4%</text>
      <text x="652" y="441" font-size="11" fill="#d4b44a" text-anchor="middle">6.0%</text>
    </svg>
  </section>

  <section class="panel">
    <h2>Sources</h2>
    <div class="sources">
      <div class="shead">Source</div>
      <div class="shead"></div>
      <div class="shead" style="text-align:right">Visits</div>
      <div class="shead" style="text-align:right">Signups</div>
      <div class="shead">Conv.</div>

      <div class="sname">Direct</div>
      <div class="track"><div class="fill" style="width:100%"></div></div>
      <div class="num">5,240</div>
      <div class="num">314</div>
      <div class="conv"><div class="ctrack"><div class="cfill" style="width:100%"></div></div><div class="cval">6.0%</div></div>

      <div class="sname">Search</div>
      <div class="track"><div class="fill" style="width:85.5%"></div></div>
      <div class="num">4,480</div>
      <div class="num">224</div>
      <div class="conv"><div class="ctrack"><div class="cfill" style="width:83.3%"></div></div><div class="cval">5.0%</div></div>

      <div class="sname">Social</div>
      <div class="track"><div class="fill" style="width:52.7%"></div></div>
      <div class="num">2,760</div>
      <div class="num">86</div>
      <div class="conv"><div class="ctrack"><div class="cfill" style="width:51.9%"></div></div><div class="cval">3.1%</div></div>
    </div>
  </section>

</div>

<div class="band" aria-hidden="true">
  <svg width="100%" height="18">
    <defs>
      <pattern id="m2" width="20" height="18" patternUnits="userSpaceOnUse">
        <path d="M0 3 H20 M19 3 V13 M19 13 H8 M8 13 V8 M8 8 H14 M0 16 H20" fill="none" stroke="#b9953a" stroke-width="2"/>
      </pattern>
    </defs>
    <rect width="100%" height="18" fill="url(#m2)"/>
  </svg>
</div>

</body>
</html>
