<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Visitation Ledger</title>
<style>
  :root{
    --abyss:#0c1816;
    --abyss-2:#10211d;
    --parchment:#ece1c6;
    --parchment-2:#e3d5b2;
    --parchment-3:#d9c99f;
    --ink:#2b241c;
    --ink-faded:#6d5f49;
    --rule:#b7a67e;
    --teal:#1f5c52;
    --teal-deep:#143f38;
    --brass:#96762f;
    --brass-deep:#6f5620;
    --wax:#7c2e2a;
    --pin:#4a4740;
    --eldritch:#3e7f6c;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:radial-gradient(1200px 800px at 50% -200px, var(--abyss-2), var(--abyss) 70%);
    color:var(--ink);
    font-family:Georgia,'Iowan Old Style','Times New Roman',serif;
  }
  .sea{position:relative;min-height:100vh;overflow:hidden;padding:40px 16px 56px}
  .tentacle{position:absolute;pointer-events:none;opacity:.22}
  .tentacle.tl{top:-30px;left:-40px}
  .tentacle.br{bottom:-40px;right:-50px;transform:rotate(180deg)}

  .cabinet{
    position:relative;
    max-width:880px;margin:0 auto;
    background:
      radial-gradient(900px 500px at 30% 0%, rgba(255,252,240,.5), rgba(255,252,240,0) 60%),
      var(--parchment);
    border:3px solid var(--brass-deep);
    outline:1px solid var(--rule);
    outline-offset:-10px;
    box-shadow:0 0 0 6px rgba(0,0,0,.35),0 30px 60px rgba(0,0,0,.5);
    padding:38px clamp(18px,5vw,54px) 46px;
  }

  header{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .plate{flex:0 0 auto}
  h1{
    font-size:clamp(24px,4vw,34px);font-weight:normal;margin:0;
    letter-spacing:.06em;
  }
  .tags{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
  .tag{
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    border:1px solid var(--rule);background:var(--parchment-2);
    padding:4px 10px;color:var(--ink-faded);
  }
  .tag.synthetic{border-color:var(--wax);color:var(--wax)}

  .ornule{display:flex;align-items:center;gap:12px;margin:34px 0 18px}
  .ornule .line{flex:1;height:1px;background:var(--rule)}
  .ornule h2{
    margin:0;font-size:13px;font-weight:normal;letter-spacing:.24em;
    text-transform:uppercase;color:var(--teal-deep);white-space:nowrap;
  }

  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px}
  .tile{
    background:var(--parchment-2);border:1px solid var(--rule);
    border-top:3px solid var(--brass);
    padding:14px 12px 12px;text-align:center;position:relative;
  }
  .tile:nth-child(odd){transform:rotate(-.5deg)}
  .tile:nth-child(even){transform:rotate(.45deg)}
  .tile .pinhead{
    position:absolute;top:-6px;left:50%;margin-left:-4px;width:8px;height:8px;
    border-radius:50%;background:var(--pin);
    box-shadow:0 1px 1px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .tile b{display:block;font-size:clamp(19px,2.6vw,26px);font-weight:normal}
  .tile span{
    display:block;margin-top:4px;font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-faded);
  }

  .case{
    background:var(--parchment-2);
    border:1px solid var(--rule);
    box-shadow:inset 0 2px 10px rgba(74,62,38,.25);
    padding:18px 10px 8px;
  }
  .case svg{display:block;width:100%;height:auto}

  .sources{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .source{
    position:relative;background:var(--parchment-2);border:1px solid var(--rule);
    padding:22px 16px 16px;text-align:center;
  }
  .source .pinhead{
    position:absolute;top:10px;left:50%;margin-left:-4px;width:8px;height:8px;
    border-radius:50%;background:var(--pin);
    box-shadow:0 1px 1px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .source h3{
    margin:8px 0 10px;font-size:13px;font-weight:normal;
    letter-spacing:.26em;text-transform:uppercase;color:var(--teal-deep);
  }
  .source .big{font-size:28px}
  .source .big small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faded)}
  .source .row{margin-top:8px;font-size:14px;color:var(--ink)}
  .source .row em{font-style:normal;color:var(--ink-faded)}
  .share{margin-top:14px}
  .share .track{height:8px;background:var(--parchment-3);border:1px solid var(--rule)}
  .share .fill{height:100%;background:var(--teal)}
  .share figcaption{margin-top:5px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faded);text-align:right}
  figure{margin:0}

  @media (max-width:720px){
    .tiles{grid-template-columns:repeat(2,1fr)}
    .sources{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="sea">

  <svg class="tentacle tl" width="340" height="340" viewBox="0 0 340 340" aria-hidden="true">
    <path d="M-20,320 C70,290 120,250 110,190 C102,140 50,130 56,92 C62,58 104,58 118,86 C130,110 118,134 96,138"
          fill="none" stroke="var(--eldritch)" stroke-width="26" stroke-linecap="round"/>
    <g fill="var(--abyss)">
      <circle cx="56" cy="300" r="5"/><circle cx="92" cy="268" r="5"/><circle cx="108" cy="228" r="5"/>
      <circle cx="104" cy="178" r="4"/><circle cx="78" cy="140" r="4"/><circle cx="70" cy="100" r="3.5"/>
      <circle cx="96" cy="80" r="3"/><circle cx="116" cy="104" r="3"/>
    </g>
  </svg>
  <svg class="tentacle br" width="340" height="340" viewBox="0 0 340 340" aria-hidden="true">
    <path d="M-20,320 C70,290 120,250 110,190 C102,140 50,130 56,92 C62,58 104,58 118,86 C130,110 118,134 96,138"
          fill="none" stroke="var(--eldritch)" stroke-width="26" stroke-linecap="round"/>
    <g fill="var(--abyss)">
      <circle cx="56" cy="300" r="5"/><circle cx="92" cy="268" r="5"/><circle cx="108" cy="228" r="5"/>
      <circle cx="104" cy="178" r="4"/><circle cx="78" cy="140" r="4"/><circle cx="70" cy="100" r="3.5"/>
      <circle cx="96" cy="80" r="3"/><circle cx="116" cy="104" r="3"/>
    </g>
  </svg>

  <main class="cabinet">
    <header>
      <svg class="plate" width="92" height="92" viewBox="0 0 92 92" aria-hidden="true">
        <circle cx="46" cy="46" r="42" fill="var(--parchment-2)" stroke="var(--brass-deep)" stroke-width="2"/>
        <circle cx="46" cy="46" r="36" fill="none" stroke="var(--rule)" stroke-width="1"/>
        <g stroke="var(--ink)" stroke-width="1.4" fill="none" stroke-linecap="round">
          <ellipse cx="30" cy="40" rx="15" ry="8" transform="rotate(-24 30 40)"/>
          <ellipse cx="62" cy="40" rx="15" ry="8" transform="rotate(24 62 40)"/>
          <ellipse cx="46" cy="47" rx="6" ry="13"/>
          <circle cx="46" cy="31" r="6"/>
          <path d="M42,36 C40,46 35,52 32,60"/>
          <path d="M46,37 C46,48 44,56 45,64"/>
          <path d="M50,36 C52,46 57,52 60,60"/>
          <path d="M41,26 C38,22 36,20 33,19"/>
          <path d="M51,26 C54,22 56,20 59,19"/>
        </g>
        <g fill="var(--ink)">
          <circle cx="43.6" cy="30" r="1.1"/><circle cx="48.4" cy="30" r="1.1"/>
        </g>
        <line x1="46" y1="14" x2="46" y2="54" stroke="var(--pin)" stroke-width="1.6"/>
        <circle cx="46" cy="14" r="3" fill="var(--wax)"/>
      </svg>
      <div>
        <h1>Weekly Visitation Ledger</h1>
        <div class="tags">
          <span class="tag">Week 01</span>
          <span class="tag synthetic">Synthetic specimen</span>
        </div>
      </div>
    </header>

    <div class="tiles">
      <div class="tile"><span class="pinhead"></span><b>12,480</b><span>visits</span></div>
      <div class="tile"><span class="pinhead"></span><b>624</b><span>signups</span></div>
      <div class="tile"><span class="pinhead"></span><b>5.0%</b><span>signups ÷ visits</span></div>
      <div class="tile"><span class="pinhead"></span><b>Sun</b><span>peak · 2,100 visits</span></div>
    </div>

    <div class="ornule"><div class="line"></div><h2>Visits by day</h2><div class="line"></div></div>
    <div class="case">
      <svg viewBox="0 0 700 236" role="img" aria-label="Bar chart of daily visits, Monday 1,420 rising to Sunday 2,100">
        <g stroke="var(--rule)" stroke-width="1" stroke-dasharray="2 4">
          <line x1="36" y1="150" x2="652" y2="150"/>
          <line x1="36" y1="100" x2="652" y2="100"/>
          <line x1="36" y1="50"  x2="652" y2="50"/>
        </g>
        <g font-size="10" fill="var(--ink-faded)" text-anchor="end">
          <text x="32" y="203">0</text>
          <text x="32" y="153">700</text>
          <text x="32" y="103">1400</text>
          <text x="32" y="53">2100</text>
        </g>

        <g fill="var(--teal)" stroke="var(--teal-deep)" stroke-width="1">
          <rect x="40"  y="99"  width="56" height="101"/>
          <rect x="132" y="86"  width="56" height="114"/>
          <rect x="224" y="73"  width="56" height="127"/>
          <rect x="316" y="83"  width="56" height="117"/>
          <rect x="408" y="63"  width="56" height="137"/>
          <rect x="500" y="56"  width="56" height="144"/>
          <rect x="592" y="50"  width="56" height="150"/>
        </g>

        <g stroke="var(--pin)" stroke-width="1.5">
          <line x1="68"  y1="77" x2="68"  y2="115"/>
          <line x1="160" y1="64" x2="160" y2="102"/>
          <line x1="252" y1="51" x2="252" y2="89"/>
          <line x1="344" y1="61" x2="344" y2="99"/>
          <line x1="436" y1="41" x2="436" y2="79"/>
          <line x1="528" y1="34" x2="528" y2="72"/>
          <line x1="620" y1="28" x2="620" y2="66"/>
        </g>
        <g fill="var(--wax)">
          <circle cx="68"  cy="77" r="3"/><circle cx="160" cy="64" r="3"/><circle cx="252" cy="51" r="3"/>
          <circle cx="344" cy="61" r="3"/><circle cx="436" cy="41" r="3"/><circle cx="528" cy="34" r="3"/>
          <circle cx="620" cy="28" r="3"/>
        </g>

        <g font-size="13" fill="var(--ink)" text-anchor="middle">
          <text x="68"  y="67">1,420</text>
          <text x="160" y="54">1,600</text>
          <text x="252" y="41">1,780</text>
          <text x="344" y="51">1,640</text>
          <text x="436" y="31">1,920</text>
          <text x="528" y="24">2,020</text>
          <text x="620" y="18">2,100</text>
        </g>

        <line x1="36" y1="200" x2="652" y2="200" stroke="var(--ink)" stroke-width="1.5"/>
        <g font-size="12" fill="var(--ink-faded)" text-anchor="middle" letter-spacing="2" style="text-transform:uppercase">
          <text x="68" y="222">MON</text><text x="160" y="222">TUE</text><text x="252" y="222">WED</text>
          <text x="344" y="222">THU</text><text x="436" y="222">FRI</text><text x="528" y="222">SAT</text>
          <text x="620" y="222">SUN</text>
        </g>
      </svg>
    </div>

    <div class="ornule"><div class="line"></div><h2>Signups by day</h2><div class="line"></div></div>
    <div class="case">
      <svg viewBox="0 0 700 202" role="img" aria-label="Bar chart of daily signups, Monday 57 rising to Sunday 127, with signup rate per day">
        <g stroke="var(--rule)" stroke-width="1" stroke-dasharray="2 4">
          <line x1="36" y1="97.5" x2="652" y2="97.5"/>
          <line x1="36" y1="55"   x2="652" y2="55"/>
        </g>
        <g font-size="10" fill="var(--ink-faded)" text-anchor="end">
          <text x="32" y="143">0</text>
          <text x="32" y="100.5">60</text>
          <text x="32" y="58">120</text>
        </g>

        <g fill="var(--brass)" stroke="var(--brass-deep)" stroke-width="1">
          <rect x="40"  y="100" width="56" height="40"/>
          <rect x="132" y="89"  width="56" height="51"/>
          <rect x="224" y="77"  width="56" height="63"/>
          <rect x="316" y="88"  width="56" height="52"/>
          <rect x="408" y="72"  width="56" height="68"/>
          <rect x="500" y="63"  width="56" height="77"/>
          <rect x="592" y="50"  width="56" height="90"/>
        </g>

        <g stroke="var(--pin)" stroke-width="1.5">
          <line x1="68"  y1="78" x2="68"  y2="116"/>
          <line x1="160" y1="67" x2="160" y2="105"/>
          <line x1="252" y1="55" x2="252" y2="93"/>
          <line x1="344" y1="66" x2="344" y2="104"/>
          <line x1="436" y1="50" x2="436" y2="88"/>
          <line x1="528" y1="41" x2="528" y2="79"/>
          <line x1="620" y1="28" x2="620" y2="66"/>
        </g>
        <g fill="var(--wax)">
          <circle cx="68"  cy="78" r="3"/><circle cx="160" cy="67" r="3"/><circle cx="252" cy="55" r="3"/>
          <circle cx="344" cy="66" r="3"/><circle cx="436" cy="50" r="3"/><circle cx="528" cy="41" r="3"/>
          <circle cx="620" cy="28" r="3"/>
        </g>

        <g font-size="13" fill="var(--ink)" text-anchor="middle">
          <text x="68"  y="68">57</text>
          <text x="160" y="57">72</text>
          <text x="252" y="45">89</text>
          <text x="344" y="56">74</text>
          <text x="436" y="40">96</text>
          <text x="528" y="31">109</text>
          <text x="620" y="18">127</text>
        </g>

        <line x1="36" y1="140" x2="652" y2="140" stroke="var(--ink)" stroke-width="1.5"/>
        <g font-size="12" fill="var(--ink-faded)" text-anchor="middle" letter-spacing="2">
          <text x="68" y="160">MON</text><text x="160" y="160">TUE</text><text x="252" y="160">WED</text>
          <text x="344" y="160">THU</text><text x="436" y="160">FRI</text><text x="528" y="160">SAT</text>
          <text x="620" y="160">SUN</text>
        </g>
        <g font-size="11" fill="var(--teal-deep)" text-anchor="middle">
          <text x="68" y="180">4.0%</text><text x="160" y="180">4.5%</text><text x="252" y="180">5.0%</text>
          <text x="344" y="180">4.5%</text><text x="436" y="180">5.0%</text><text x="528" y="180">5.4%</text>
          <text x="620" y="180">6.0%</text>
        </g>
        <text x="676" y="180" font-size="10" fill="var(--ink-faded)" text-anchor="end">rate</text>
      </svg>
    </div>

    <div class="ornule"><div class="line"></div><h2>Sources</h2><div class="line"></div></div>
    <div class="sources">
      <div class="source">
        <span class="pinhead"></span>
        <h3>Direct</h3>
        <div class="big">5,240 <small>visits</small></div>
        <div class="row">314 signups · <em>6.0% rate</em></div>
        <figure class="share">
          <div class="track"><div class="fill" style="width:42%"></div></div>
          <figcaption>42% of visits</figcaption>
        </figure>
      </div>
      <div class="source">
        <span class="pinhead"></span>
        <h3>Search</h3>
        <div class="big">4,480 <small>visits</small></div>
        <div class="row">224 signups · <em>5.0% rate</em></div>
        <figure class="share">
          <div class="track"><div class="fill" style="width:35.9%"></div></div>
          <figcaption>36% of visits</figcaption>
        </figure>
      </div>
      <div class="source">
        <span class="pinhead"></span>
        <h3>Social</h3>
        <div class="big">2,760 <small>visits</small></div>
        <div class="row">86 signups · <em>3.1% rate</em></div>
        <figure class="share">
          <div class="track"><div class="fill" style="width:22.1%"></div></div>
          <figcaption>22% of visits</figcaption>
        </figure>
      </div>
    </div>
  </main>
</div>
</body>
</html>
