<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 01</title>
<style>
  :root{
    --bg:#140a0f;
    --panel-a:#261220;
    --panel-b:#1b0c13;
    --ivory:#ede3cd;
    --ivory-dim:#c6b79c;
    --gold:#d6ac66;
    --gold-bright:#e9c57f;
    --gold-dim:rgba(214,172,102,.28);
    --hairline:rgba(214,172,102,.16);
    --marble-1:#f2e9d6;
    --marble-2:#dccfb3;
    --serif:Didot,"Didot LT STD","Bodoni MT","Bodoni 72",Cochin,"Times New Roman",Georgia,serif;
  }
  html{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(1100px 540px at 50% -160px,#371720,var(--bg) 72%) var(--bg);
    color:var(--ivory);
    font-family:var(--serif);
    -webkit-font-smoothing:antialiased;
  }
  .curtain{display:block;width:100%;height:64px}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px 56px}

  header{text-align:center;padding:30px 0 0}
  .emblem{display:block;width:132px;height:auto;margin:0 auto 12px}
  h1{
    font-size:clamp(34px,6vw,48px);
    font-weight:400;
    letter-spacing:.2em;
    padding-left:.2em;
    text-transform:uppercase;
    color:var(--ivory);
  }
  .chip{
    display:inline-block;
    margin-top:14px;
    padding:4px 12px;
    border:1px solid var(--gold-dim);
    color:var(--gold);
    font-size:10px;
    letter-spacing:.24em;
    text-transform:uppercase;
  }
  .stats{display:flex;justify-content:center;margin-top:30px}
  .stats>div{padding:2px 34px}
  .stats>div+div{border-left:1px solid var(--hairline)}
  .stats dt{
    font-size:10.5px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:8px;
  }
  .stats dd{font-size:clamp(26px,4.5vw,36px);font-variant-numeric:tabular-nums}
  .meander{display:block;width:min(560px,100%);height:20px;margin:30px auto 0;opacity:.85}
  .meander.end{margin-top:34px}

  main{margin-top:26px}
  .panel{
    position:relative;
    background:linear-gradient(180deg,var(--panel-a),var(--panel-b));
    border:1px solid var(--gold-dim);
    padding:30px 26px 26px;
  }
  .panel::after{
    content:"";
    position:absolute;
    inset:5px;
    border:1px solid rgba(214,172,102,.12);
    pointer-events:none;
  }
  .panel+.panel{margin-top:22px}
  .chart{display:block;width:100%;height:auto}

  svg text{font-family:var(--serif)}
  .panel-h{font-size:11px;letter-spacing:.2em;text-transform:uppercase;fill:var(--gold)}
  .axis{font-size:11px;fill:var(--ivory-dim)}
  .day{font-size:12.5px;fill:var(--ivory-dim)}
  .rn{font-size:10px;letter-spacing:.1em;fill:var(--gold);opacity:.8}
  .cap-label,.note-l{
    font-size:12.5px;fill:var(--ivory);
    stroke:#1d0e15;stroke-width:3px;paint-order:stroke;stroke-linejoin:round;
    font-variant-numeric:tabular-nums;
  }
  .conv{font-size:12.5px;fill:var(--ivory-dim);font-variant-numeric:tabular-nums}
  .gold-t{fill:var(--gold-bright)}
  .grid{stroke:rgba(237,227,205,.07)}
  .staff{stroke:rgba(237,227,205,.2)}
  .base{stroke:rgba(214,172,102,.45)}
  .flute{stroke:#c3b08c;stroke-opacity:.5}
  .stem{stroke:#d6ac66;stroke-width:1.2;opacity:.8}

  .scroll{overflow-x:auto}
  table{width:100%;min-width:620px;border-collapse:collapse}
  th,td{padding:11px 12px;text-align:left}
  thead th{
    font-weight:400;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--gold);border-bottom:1px solid var(--gold-dim);white-space:nowrap;
  }
  tbody td{border-bottom:1px solid var(--hairline)}
  tbody th{
    font-weight:400;font-size:15px;letter-spacing:.06em;
    border-bottom:1px solid var(--hairline);white-space:nowrap;
  }
  tfoot td,tfoot th{
    border-top:1px solid rgba(214,172,102,.4);
    font-weight:400;padding-top:13px;white-space:nowrap;
  }
  tfoot th{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
  .num{text-align:right;font-variant-numeric:tabular-nums;font-size:15px}
  thead .num{font-size:10.5px}
  .best{color:var(--gold-bright)}
  .bar-cell{width:38%}
  .track{
    position:relative;height:18px;min-width:170px;
    box-shadow:inset 0 0 0 1px rgba(237,227,205,.12);
  }
  .bv{height:100%;background:linear-gradient(180deg,var(--marble-1),var(--marble-2))}
  .bs{position:absolute;left:0;top:0;height:100%;background:var(--gold)}
  .legend{font-size:10px;letter-spacing:.12em;text-transform:lowercase}
  .sw{display:inline-block;width:9px;height:9px;margin:0 5px -1px 0}
  .sw-v{background:#e9dec6}
  .sw-s{background:var(--gold);margin-left:12px}

  @media (max-width:560px){
    .stats>div{padding:2px 16px}
    .panel{padding:22px 14px 18px}
    .emblem{width:104px}
  }
</style>
</head>
